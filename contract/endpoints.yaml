# 跨域 endpoint 注册表。
#
# 本文是 endpoint、类型、提供方、消费方、QoS 与关键约束的唯一注册表，
# 由 tools/contract_gate.py 做双向闭合校验：
#   - 本仓库每个 .msg/.srv/.action 必须被至少一个 endpoint 引用
#   - 每个 endpoint 的 type 必须真实存在于本仓库或声明为外部标准类型
#
# Wire schema 由本仓库对应 IDL 定义。不在本表中的跨域 endpoint 视为未授权。
# 域取值：rt_control / perception / motion / navigation / autonomy / external

version: "2.0.0"

domains: [rt_control, perception, motion, navigation, autonomy, external]

# 自定义 IDL 按 endpoint 提供方所属域唯一归档。shared 承载跨域共用
# 的基础载荷。消费域直接依赖提供方包，不复制 IDL。
package_owners:
  robot_system_interfaces: shared
  robot_rt_control_interfaces: rt_control
  robot_perception_interfaces: perception
  robot_navigation_interfaces: navigation
  robot_motion_interfaces: motion
  robot_autonomy_interfaces: autonomy

qos_profiles: [Q_CONTROL, Q_ROLLING_COMMAND, Q_ROLLING_STATE, Q_FAST_STATE, Q_STATE, Q_LATCHED, Q_SENSOR, Q_DIAGNOSTIC, Q_DEFAULT]

axis_sets:
  v3_dual_arm:
    count: 14
    joint_names: [right_joint1, right_joint2, right_joint3, right_joint4,
                  right_joint5, right_joint6, right_joint7,
                  left_joint1, left_joint2, left_joint3, left_joint4,
                  left_joint5, left_joint6, left_joint7]
    position_unit: rad
    velocity_unit: rad/s
  # 双臂 FJT/流式轨迹控制器（arms_jtc）的轴：双臂 14 轴加升降。消息里按 joint_names 匹配，顺序不限。
  v3_dual_arm_updown:
    count: 15
    joint_names: [right_joint1, right_joint2, right_joint3, right_joint4,
                  right_joint5, right_joint6, right_joint7,
                  left_joint1, left_joint2, left_joint3, left_joint4,
                  left_joint5, left_joint6, left_joint7, updown]
    position_unit: "rad；updown 为 m"
    velocity_unit: "rad/s；updown 为 m/s"
  v3_swerve_wheels:
    count: 8
    joint_names: [steer1_joint, steer2_joint, steer3_joint, steer4_joint,
                  wheel1_joint, wheel2_joint, wheel3_joint, wheel4_joint]
    position_unit: rad
    velocity_unit: rad/s

# Application schema for the standard Float64MultiArray, not a new IDL type.
navigation_execution_v1:
  version: 1
  size: 91
  header: [schema_version, snapshot_ros_time, sequence, ready, status, gated,
           waiting_for_alignment, translation_branch, reference_vx, reference_vy,
           reference_wz, reference_ax, reference_ay, reference_alpha, measured_vx,
           measured_vy, measured_wz, max_steering_rate, max_steering_acceleration,
           max_steering_jerk, max_translation_acceleration, max_body_jerk,
           max_wheel_acceleration, max_wheel_speed, gate, release, flip_hysteresis]
  module: [module_id, actual_heading, actual_wheel_speed, reference_heading,
           reference_heading_rate, reference_heading_acceleration, reference_wheel_speed,
           reversed, holding, final_heading_target, heading_error, effective_heading_min,
           effective_heading_max, wheel_radius, module_x, module_y]
  module_ids: [1, 2, 3, 4]
  accepted_ready: 1
  accepted_statuses: [1, 2, 3]
  all_fields_finite: true
  max_age_ms: 100
  max_future_ms: 10
  stamp_must_advance: true
  sequence_range: [0, 9007199254740991]
  header_booleans: [ready, gated, waiting_for_alignment]
  module_booleans: [reversed, holding]
  translation_branches: [-1, 0, 1]
  configuration_absolute_tolerance: 0.00001
  observed_steering_rate:
    minimum_actual_samples: 2
    provenance: [hardware_sequence_and_sample_time, host_receive_age_fall]
    require_advancing_observation_time: true
    host_observer_hz: 1000
    host_sync_period_ms: 4
    host_receive_age_strict_fall: true
    ambiguous_continuity_resets_history: true
    device_timestamp_claimed_for_host_observer: false
    invalid_value: NaN
    zero_fallback: false

endpoints:
  - id: G-01
    legacy_only: true
    note: "Legacy V2 Demo schema；不能直接用于 V3 任务；V3 Autonomy 仅按注册表调用泵/LED/保护复位，不直接控制阀/运动"
    ros_name: /autonomy/execute_demo_task
    kind: action
    type: robot_autonomy_interfaces/action/ExecuteDemoTask
    producer: autonomy
    consumers: [external]
    qos: Q_DEFAULT
    constraint: "同时只接受一个活动 Goal，第二个在 Goal 响应阶段 reject；终态三选一"


  - id: P-01
    legacy_only: true
    note: "Legacy V2 固定计划协议：25箱/15序列/0.74m；不代表 V3 箱墙观测和选箱职责"
    ros_name: /perception/build_wall_task_plan
    kind: action
    type: robot_perception_interfaces/action/BuildWallTaskPlan
    producer: perception
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "Goal 携带非零 `task_id` 与锁定 `scene_profile_id`；真实单次同步采集；Result 返回新 `scene_id`；25 箱；固定 15 序列；每箱冻结 arm 与 suction_mode，pose 为吸取表面接触位姿；每序列自带 `station_id`、统一 0.74 m 退避的 `station_nav_pose(map)`、按臂绑定重拍位；每个 G-01 只调用一次；严格成功"


  - id: P-02
    legacy_only: true
    note: "Legacy V2 序列精定位协议；不代表 V3 墙图更新和掉箱识别"
    ros_name: /perception/refine_sequence_poses
    kind: action
    type: robot_perception_interfaces/action/RefineSequencePoses
    producer: perception
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "Goal 的 `expected_scene_id`、sequence、box_ids、arms、suction_modes 必须与当前 producer instance 最近一次成功 P-01 完全一致；同箱同序；返回同臂同吸取方式的吸取表面接触位姿；`base_link`；stamp=真实曝光时刻；底盘静止、TF、标定不变"


  - id: P-03
    ros_name: /perception/obstacle_cloud
    kind: topic
    type: robot_perception_interfaces/msg/ObstacleCloud
    producer: perception
    consumers: [motion]
    qos: Q_STATE
    reserved: true
    constraint: "**产品预留**；Demo 不部署、不订阅、不依赖"


  - id: P-04
    ros_name: /perception/readiness
    kind: topic
    type: robot_system_interfaces/msg/DomainReadiness
    producer: perception
    consumers: [autonomy]
    qos: Q_LATCHED
    rate_hz: [1, 1]
    constraint: "`Q_LATCHED`；故障立即 `ready=false`；变化立即发；稳定 1 Hz；V0.4 依次发布 readiness_name 为 wall_map_read、wall_observation、dropped_box_recognition 的三条，按 domain+readiness_name 分别缓存，只用 ready 作为准入结论"


  - id: P-NAV-01
    ros_name: /odom
    kind: topic
    type: nav_msgs/msg/Odometry
    producer: navigation
    consumers: [perception, autonomy]
    qos: Q_FAST_STATE
    rate_hz: [50, 50]
    max_age_ms: 200
    external_type: true
    constraint: "Navigation 发布融合里程计；50 Hz；最大年龄 200 ms；Perception 可用于定位/视觉时空对齐；**最终停稳证据**"


  - id: P-NAV-02
    ros_name: /tf
    kind: topic
    type: tf2_msgs/msg/TFMessage
    producer: navigation
    consumers: [perception, autonomy]
    qos: Q_DEFAULT
    external_type: true
    note: map → odom 由 Navigation 发布；Perception 通过 TF 查询 map→odom
    constraint: "map→odom 定位边唯一发布者为 Navigation；/tf 按坐标边判唯一性"
    multi_producer: true  # /tf 按坐标边判唯一性，见契约 6.11


  - id: N-01
    ros_name: /navigation/navigate_to_pose
    kind: action
    type: robot_navigation_interfaces/action/NavigateToPoseTask
    producer: navigation
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "`target_name + map_version` 由 Navigation 通过语义地图解析为 Nav2 目标；真实调用 Nav2；最多总调用三次；SUCCEEDED 必须同时满足位置和朝向到位、定位有效、实际运动反馈确认已停稳，不以零速指令或 Nav2 自身成功代替；CANCELED 必须对应车已停止，无法确认时返回失败；目标与当前位置 XY 相同时原地旋转；受理时固定目标位姿"


  - id: N-04
    ros_name: /rt/base/cmd_vel
    kind: topic
    type: geometry_msgs/msg/Twist
    producer: navigation
    consumers: [rt_control]
    qos: Q_CONTROL
    rate_hz: [20, 50]
    watchdog_ms: 500
    external_type: true
    note: "由 navigation 域发送；Twist 无 header，看门狗只使用 RT 本地接收间隔；后续 Motion 接管底盘另立协议"
    constraint: "底盘速度入口，仅在 R-IN-23 为 VELOCITY_READY（使能后默认）时生效，FJT_READY 时不被接受；20～50 Hz；500 ms 本地接收超时；不与旧 `/cmd_vel_safe` 或未来第二 writer 并行生效；台架调试时 RT-Control 操作网页可替代 Navigation 发送，与 Navigation 互斥，同一时间只允许一个发送方"

  - id: N-07
    ros_name: /rt/base/terminal_rotation_request
    kind: topic
    type: std_msgs/msg/Bool
    producer: navigation
    consumers: [rt_control]
    qos: Q_CONTROL
    rate_hz: [50, 50]
    watchdog_ms: 300
    external_type: true
    note: "Navigation provides this request, as for N-04; design robot_driver#334"
    constraint: "Only a terminal-rotation intent, never enable or velocity authority; true renews a local monotonic lease valid through age <=300 ms, expired at >300 ms; false clears on the next core tick without waiting for lease expiry; inactive lifecycle, disable, fault, or leaving VELOCITY_READY clears and requires a new request; no retained/replayed request; see contract/navigation-execution-v1.md"


  - id: N-05
    ros_name: /navigation/localization/status
    kind: topic
    type: robot_navigation_interfaces/msg/LocalizationStatus
    producer: navigation
    consumers: [autonomy]
    qos: Q_STATE
    rate_hz: [10, 20]
    max_age_ms: 200
    constraint: "发布者唯一；10～20 Hz；最大年龄 200 ms"


  - id: N-10
    ros_name: /navigation/semanticmap/landmark_array
    kind: topic
    type: robot_navigation_interfaces/msg/LandmarkArray
    producer: navigation
    consumers: [perception, autonomy, external]
    qos: Q_STATE
    constraint: "当前语义地图地标列表；按 map_version 区分地图版本"


  - id: N-11
    ros_name: /navigation/semanticmap/add_landmark
    kind: service
    type: robot_navigation_interfaces/srv/AddLandmark
    producer: navigation
    consumers: [perception, external]
    qos: Q_DEFAULT
    constraint: "按指定位姿新增语义地标；返回 used_map_version 与最终地标"


  - id: N-12
    ros_name: /navigation/semanticmap/add_current_landmark
    kind: service
    type: robot_navigation_interfaces/srv/AddCurrentLandmark
    producer: navigation
    consumers: [perception, external]
    qos: Q_DEFAULT
    constraint: "以当前 base_footprint 位姿新增语义地标；返回 used_map_version 与最终地标"


  - id: N-13
    ros_name: /navigation/semanticmap/update_landmark
    kind: service
    type: robot_navigation_interfaces/srv/UpdateLandmark
    producer: navigation
    consumers: [perception, external]
    qos: Q_DEFAULT
    constraint: "更新语义地标属性和位姿；返回 used_map_version 与最终地标"


  - id: N-14
    ros_name: /navigation/semanticmap/remove_landmark
    kind: service
    type: robot_navigation_interfaces/srv/RemoveLandmark
    producer: navigation
    consumers: [perception, external]
    qos: Q_DEFAULT
    constraint: "按 name 删除指定 map_version 内的语义地标"


  - id: N-15
    ros_name: /navigation/semanticmap/get_landmark
    kind: service
    type: robot_navigation_interfaces/srv/GetLandmark
    producer: navigation
    consumers: [perception, autonomy, external]
    qos: Q_DEFAULT
    constraint: "按 target_name 查询语义地标；N-01 服务端用它解析导航目标"


  - id: N-16
    ros_name: /navigation/semanticmap/get_map
    kind: service
    type: robot_navigation_interfaces/srv/GetSemanticMap
    producer: navigation
    consumers: [perception, autonomy, external]
    qos: Q_DEFAULT
    constraint: "查询指定 map_version 下全部语义地标"


  - id: N-17
    legacy_only: true
    ros_name: /navigation/mapping/set_turn_state
    kind: service
    type: robot_navigation_interfaces/srv/SetMappingTurnState
    producer: navigation
    consumers: [autonomy, external]
    qos: Q_DEFAULT
    note: "Legacy V2 Turn 边界，保留既有协议；不是 V3 底盘接管或同步运动接口；turn_sequence 单调递增，同一 BEGIN_TURN/TURN_COMPLETE 重试幂等"
    constraint: "转台运动前 BEGIN_TURN 必须先暂停 FAST-LIO 到底盘的融合输入；停稳后同 caller_id、turn_sequence 的 TURN_COMPLETE 仅在实时 base_footprint←LiDAR TF 新鲜且连续稳定满配置窗口时切换固定外参，丢弃切换前排队里程计并恢复融合；乱序、并发事务或调用者不一致必须拒绝"


  - id: M-08
    legacy_only: true
    ros_name: /motion/execute_stage
    kind: action
    type: robot_motion_interfaces/action/ExecuteMotionStage
    producer: motion
    consumers: [autonomy]
    qos: Q_DEFAULT
    note: "Legacy V2 分阶段机械动作：12臂轴与Turn/Updown；保留供旧消费者迁移，不是 V3 双七轴或新抓放流程；不得通过旧流程调用已退役 VacuumGrip"
    constraint: "单一串行阶段 Action；无活动抓取流程时 TURN/CAMERA_VIEW/NAMED_JOINT_POSE 可任意独立触发；抓取流程固定 PREGRASP→APPROACH→PLACE→HOME，活动期间禁止独立任务、并发、跳步和提前触发"


  - id: M-09
    ros_name: /rt/arms/rolling/target_batch
    kind: topic
    type: robot_motion_interfaces/msg/RollingJointTargetBatch
    producer: motion
    consumers: [rt_control]
    qos: Q_ROLLING_COMMAND
    rate_hz: [30, 30]
    axis_set: v3_dual_arm
    note: "三代双七轴：right_joint1..7 后接 left_joint1..7；全部 rad/rad/s；从 replace_from 起替换缓冲轨迹，非运动臂仍须包含"
    constraint: "仅在 /rt/arms/set_control_mode 切到 ROLLING_READY 后生效；epoch 等于 R-OUT-07 当前 epoch；sequence 在同一 epoch 内严格递增；replace_from 为 ROS 时间（运控与 RT-Control 同机），不早于当前时刻 + 替换提前量；首点 time_from_start=0，位置与速度在拼接容差内等于缓冲轨迹在 replace_from 处的值；点时间严格递增，1～256 点，总长不超过缓冲上限；位置/速度/加速度不超过 robot_description 关节限位，且从任一点起都能在限值内停住；不满足整批拒绝，结果见 R-OUT-07 last_result；final=true 为本段最后一批，末点各轴速度须为 0（否则 FINAL_NOT_AT_REST）；最新接受的批次为 final 时不再需要后续批次、不计更新超时，执行到末点后保持并报 STOP_COMPLETED，期间仍可用新批次从其 replace_from 起替换，替换批次非 final 时恢复更新超时；最新接受的批次非 final 时，超过更新超时未收到有效批次，或缓冲耗尽时按限值刹停并保持；best-effort/volatile/keep-last(1)，deadline/lifespan 100 ms；台架调试时 RT-Control 操作网页可经 `robot_interfaces_rolling_client` 替代 Motion 发送，与 Motion 互斥，同一时间只允许一个发送方"


  - id: M-06
    ros_name: /motion/readiness
    kind: topic
    type: robot_system_interfaces/msg/DomainReadiness
    producer: motion
    consumers: [autonomy]
    qos: Q_LATCHED
    rate_hz: [1, 1]
    constraint: "机械能力准入；变化立即发；稳定 1 Hz"


  - id: N-06
    ros_name: /navigation/readiness
    kind: topic
    type: robot_system_interfaces/msg/DomainReadiness
    producer: navigation
    consumers: [autonomy]
    qos: Q_LATCHED
    rate_hz: [1, 1]
    constraint: "导航执行能力准入；变化立即发；稳定 1 Hz"


  - id: R-IN-02
    ros_name: /rt/arms/follow_joint_trajectory
    kind: action
    type: control_msgs/action/FollowJointTrajectory
    producer: rt_control
    consumers: [motion]
    qos: Q_DEFAULT
    external_type: true
    axis_set: v3_dual_arm_updown
    note: "三代双七轴加升降：right_joint1..7、left_joint1..7、updown，完整 15 轴，按 joint_names 匹配、顺序不限；allow_partial_joints_goal=false"
    constraint: "完整 15 轴：三代双臂 7+7 轴加升降 updown，joint_names 必须恰含这 15 个，按名称匹配、顺序不限；双臂位置 rad、速度 rad/s，updown 位置 m、速度 m/s；升降不动时也必须包含并保持当前位置；不包含 turn 或 PP；`allow_partial_joints_goal=false`；整组取消。准入（RT-Control 实时侧）：每点必须带速度、末点速度为 0；首点时间为 0 时距实测位置 ≤ 1°（updown ≤ 5 mm），首点在未来时距实测位置 ≤ 速度上限×首点时间；各点速度与每段平均速度 ≤ 速度上限；每段三次插值加速度（含从上一条指令接入首点的一段）≤ 加速度上限；上限为 RT-Control 控制器加载的逐轴表（速度取自 robot_description）：joint1～3 速度 75°/s、加速度 373°/s²，joint4 速度 100.2°/s、加速度 498.4°/s²，joint5～7 速度 180°/s、加速度 895.3°/s²，左右臂相同，updown 速度 0.1666 m/s、加速度 0.4 m/s²；Motion 规划时各轴加速度不超过该表的 95%（joint1～3 为 354°/s²），业务动作的臂速度另按 Motion 自身配置限制；不满足整条拒绝"


  - id: R-IN-02L
    ros_name: /rt/arms/left/follow_joint_trajectory
    kind: action
    type: control_msgs/action/FollowJointTrajectory
    producer: rt_control
    consumers: [motion]
    qos: Q_DEFAULT
    external_type: true
    constraint: "仅单臂作用域提供；left_joint1..7；位置 rad、速度 rad/s；`allow_partial_joints_goal=false`；整组取消；双臂作用域只提供 R-IN-02"

  - id: R-IN-02R
    ros_name: /rt/arms/right/follow_joint_trajectory
    kind: action
    type: control_msgs/action/FollowJointTrajectory
    producer: rt_control
    consumers: [motion]
    qos: Q_DEFAULT
    external_type: true
    constraint: "仅单臂作用域提供；right_joint1..7；其余同 R-IN-02L"

  - id: R-IN-22
    ros_name: /rt/arms/joint_trajectory
    kind: topic
    type: trajectory_msgs/msg/JointTrajectory
    producer: rt_control
    consumers: [motion]
    qos: Q_CONTROL
    external_type: true
    axis_set: v3_dual_arm_updown
    note: "流式下发（遥操作、视觉伺服、在线重规划）；与 R-IN-02 同一控制器，新消息替换尚未执行的轨迹；断流后保持最后目标"
    constraint: "完整 15 轴（三代双臂 7+7 轴加 updown），轴名、单位、准入同 R-IN-02；用 header.stamp 标注首点时间基准；末点速度必须为 0；控制器从上一条指令接续新轨迹；与 R-IN-02 并发时以最后到达者为准（执行中的 action 目标被中止）"

  - id: R-IN-22L
    ros_name: /rt/arms/left/joint_trajectory
    kind: topic
    type: trajectory_msgs/msg/JointTrajectory
    producer: rt_control
    consumers: [motion]
    qos: Q_CONTROL
    external_type: true
    constraint: "仅单臂作用域提供；left_joint1..7；其余同 R-IN-22"

  - id: R-IN-22R
    ros_name: /rt/arms/right/joint_trajectory
    kind: topic
    type: trajectory_msgs/msg/JointTrajectory
    producer: rt_control
    consumers: [motion]
    qos: Q_CONTROL
    external_type: true
    constraint: "仅单臂作用域提供；right_joint1..7；其余同 R-IN-22"

  - id: R-IN-18
    ros_name: /rt/enable
    kind: service
    type: robot_rt_control_interfaces/srv/RtEnable
    producer: rt_control
    consumers: [external]
    qos: Q_DEFAULT
    constraint: "按使能策略分批使能全部受管驱动与握手设备并激活运动控制器；失败时返回失败批次、关节、状态字、阶段与 DREE 错误；不复位急停、安全继电器或 STO"

  - id: R-IN-19
    ros_name: /rt/disable
    kind: service
    type: robot_rt_control_interfaces/srv/RtEnable
    producer: rt_control
    consumers: [external]
    qos: Q_DEFAULT
    constraint: "停用运动控制器后有序失能全部受管设备；已失能时直接成功"

  - id: R-IN-20
    ros_name: /rt/reset_fault
    kind: service
    type: robot_rt_control_interfaces/srv/RtEnable
    producer: rt_control
    consumers: [external]
    qos: Q_DEFAULT
    constraint: "对作用域内全部故障设备做一次组复位；任一从站不在 OP 或反馈过期时拒绝（device_offline）；需要重启时拒绝（restart_required）；不使能"

  - id: R-IN-21
    ros_name: /rt/run_self_check
    kind: service
    type: std_srvs/srv/Trigger
    producer: rt_control
    consumers: [external]
    qos: Q_DEFAULT
    external_type: true
    constraint: "用最新一组设备状态重跑启动自检规则；success=false 表示有阻断项；message 给出阻断/警告数量；不写总线、不改变使能状态"

  - id: R-IN-04
    ros_name: /rt/vacuum/pump/set_enabled
    kind: service
    type: robot_rt_control_interfaces/srv/SetEnabled
    producer: rt_control
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "Autonomy 设置共用泵目标状态；普通停泵要求左右阀回读有效且为释放、左右压力有效且 >= -1 kPa、无活动阀操作；检查与执行期间阻止新吸附；enabled 为输出回读，输出未确认或未知时 accepted=false 并在 error 给出原因；reason 为 manual 的人工停泵不受上述停泵准入限制，由操作员保证箱子已有人扶住"


  - id: R-IN-05L
    ros_name: /rt/vacuum/left_valve/set_enabled
    kind: service
    type: robot_rt_control_interfaces/srv/SetEnabled
    producer: rt_control
    consumers: [motion, autonomy]
    qos: Q_DEFAULT
    constraint: "enabled=true 吸附、false 释放；输出回读确认即返回 accepted=true，不等待建立真空；同侧忙拒绝；RT 不自动重试；输出未确认或未知时 accepted=false 并在 error 给出原因；正常抓放由 Motion 调用；Autonomy 只在重置流程和联调操作页的人工开关时调用，流程自动执行期间不调用"

  - id: R-IN-05R
    ros_name: /rt/vacuum/right_valve/set_enabled
    kind: service
    type: robot_rt_control_interfaces/srv/SetEnabled
    producer: rt_control
    consumers: [motion, autonomy]
    qos: Q_DEFAULT
    constraint: "同 R-IN-05L，作用于右阀"

  - id: R-IN-06
    ros_name: /rt/arms/set_control_mode
    kind: service
    type: robot_rt_control_interfaces/srv/SetJointControlMode
    producer: rt_control
    consumers: [motion]
    qos: Q_DEFAULT
    constraint: "仅在已使能且手臂静止时切换 FJT_READY/ROLLING_READY（VELOCITY_READY 只用于底盘 R-IN-23，手臂拒绝）；切换前 Motion 取消并等待 R-IN-02 Action 终态；新控制器以当前位置保持起步；失败时 accepted=false 并给出 ErrorInfo，mode 为调用后的实际模式；歧义切换进入 RESTART_REQUIRED（见 R-OUT-09）"


  - id: R-IN-23
    ros_name: /rt/base/set_control_mode
    kind: service
    type: robot_rt_control_interfaces/srv/SetJointControlMode
    producer: rt_control
    consumers: [motion]
    qos: Q_DEFAULT
    constraint: "仅在已使能且底盘静止时在 VELOCITY_READY（舵轮控制器接受 N-04，行走轮 CSV）与 FJT_READY（R-IN-24/R-IN-25 的轮子轨迹控制器接管 8 个轮关节位置，行走轮 CSP）之间切换；使能后默认 VELOCITY_READY；切换前协调 Navigation 停发 N-04、由 Motion 取消并等待 R-IN-24 Action 终态；新控制器以当前位置保持起步，行走轮驱动器确认新模式后才返回成功；ROLLING_READY 拒绝；失败时 accepted=false 并给出 ErrorInfo，mode 为调用后的实际模式；歧义切换进入 RESTART_REQUIRED（见 R-OUT-09）"


  - id: R-IN-24
    ros_name: /rt/base/follow_joint_trajectory
    kind: action
    type: control_msgs/action/FollowJointTrajectory
    producer: rt_control
    consumers: [motion]
    qos: Q_DEFAULT
    external_type: true
    axis_set: v3_swerve_wheels
    note: "底盘 8 个轮关节 steer1..4_joint、wheel1..4_joint；行走轮为连续关节，位置为累计转角；allow_partial_joints_goal=false"
    constraint: "仅在 R-IN-23 为 FJT_READY 时接受；完整 8 轴；位置 rad、速度 rad/s；转向位置在机器人模型限位内；`allow_partial_joints_goal=false`；整组取消。准入（RT-Control 实时侧）：每点必须带速度、末点速度为 0；首点时间为 0 时距实测位置 ≤ 1°，首点在未来时距实测位置 ≤ 速度上限×首点时间；速度与加速度不超过底盘导航限值（转向 35°/s、35°/s²；行走轮轮面 2 m/s、2 m/s²，按轮半径换算为关节单位；由 RT-Control 底盘导航配置拥有，与 N-04 同一组）；不满足时整条拒绝（INVALID_GOAL），不执行半条"


  - id: R-IN-25
    ros_name: /rt/base/joint_trajectory
    kind: topic
    type: trajectory_msgs/msg/JointTrajectory
    producer: rt_control
    consumers: [motion]
    qos: Q_CONTROL
    external_type: true
    axis_set: v3_swerve_wheels
    note: "流式下发；与 R-IN-24 同一控制器，新消息替换尚未执行的轨迹；断流后保持最后目标"
    constraint: "仅在 R-IN-23 为 FJT_READY 时接受；完整 8 轴；位置 rad、速度 rad/s；准入同 R-IN-24；用 header.stamp 标注首点时间基准；末点速度必须为 0；控制器从上一条指令接续新轨迹；与 R-IN-24 并发时以最后到达者为准（执行中的 action 目标被中止）"


  - id: R-IN-12
    ros_name: /rt/led/set_rgbw
    kind: service
    type: robot_rt_control_interfaces/srv/SetLedRgbw
    producer: rt_control
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "六路灯带完整 RGBW 设置；全零灭灯；响应只证明通信写确认，不证明实际发光；退出和重启不主动改色或重放"


  - id: R-IN-16
    ros_name: /rt/head/move
    kind: action
    type: robot_rt_control_interfaces/action/MoveHead
    producer: rt_control
    consumers: [perception]
    qos: Q_DEFAULT
    constraint: "具名 head_joint/head_pitch_joint 弧度目标；同资源忙拒绝；取消停止并保持；旧 command topic 不允许外部并行写入"


  - id: R-OUT-01
    ros_name: /tf
    kind: topic
    type: tf2_msgs/msg/TFMessage
    producer: rt_control
    consumers: [perception, motion, navigation, autonomy]
    qos: Q_DEFAULT
    external_type: true
    note: robot_state_publisher 发布本体动态 TF
    constraint: "本体动态坐标边唯一；`map→odom` 与 `odom→base_footprint` 不由本域发布"
    multi_producer: true  # /tf 按坐标边判唯一性，见契约 6.11


  - id: R-OUT-01S
    ros_name: /tf_static
    kind: topic
    type: tf2_msgs/msg/TFMessage
    producer: rt_control
    consumers: [perception, motion, navigation, autonomy]
    qos: Q_LATCHED
    external_type: true
    note: robot_state_publisher 发布本体固定坐标边
    constraint: "本体固定坐标边唯一；`Q_LATCHED`；与 `/tf` 分开登记"


  - id: R-OUT-02
    ros_name: /rt/base/odom
    kind: topic
    type: nav_msgs/msg/Odometry
    producer: rt_control
    consumers: [perception, navigation]
    qos: Q_FAST_STATE
    rate_hz: [50, 50]
    max_age_ms: 200
    external_type: true
    note: frame_id=odom，child_frame_id=base_footprint；rt-control 不发 odom→base_footprint TF
    constraint: "`frame_id=odom`、`child_frame_id=base_footprint`；`Q_FAST_STATE`；50 Hz；**不作为到站或停稳最终证据**"


  - id: R-OUT-03
    ros_name: /joint_states
    kind: topic
    type: sensor_msgs/msg/JointState
    producer: rt_control
    consumers: [motion, perception, autonomy]
    qos: Q_FAST_STATE
    external_type: true
    note: "整机各受管模块按真实采样时间发布不重叠关节子集；一关节一个权威来源；有效性与时效由模块状态配套表达"
    constraint: "双臂、PP、升降、头部及底盘相关关节使用统一入口；不填伪造零值、不刷新旧样本时间、不把多模块拼成虚假同步快照"


  - id: R-OUT-04L
    ros_name: /rt/battery/left/state
    kind: topic
    type: sensor_msgs/msg/BatteryState
    producer: rt_control
    consumers: [autonomy]
    qos: Q_STATE
    rate_hz: [0.2, 0.2]
    note: BMS 周期 5 s；只读，不作为业务控制入口
    external_type: true
    constraint: "左电池（BMS 地址 1）；BMS 周期 5 s（0.2 Hz）；只读，不作为业务控制入口"


  - id: R-OUT-04R
    ros_name: /rt/battery/right/state
    kind: topic
    type: sensor_msgs/msg/BatteryState
    producer: rt_control
    consumers: [autonomy]
    qos: Q_STATE
    rate_hz: [0.2, 0.2]
    note: BMS 周期 5 s；只读，不作为业务控制入口
    external_type: true
    constraint: "右电池（BMS 地址 2）；BMS 周期 5 s（0.2 Hz）；只读，不作为业务控制入口"


  - id: R-OUT-05L
    ros_name: /rt/vacuum/left/pressure
    kind: topic
    type: sensor_msgs/msg/FluidPressure
    producer: rt_control
    consumers: [motion, autonomy]
    qos: Q_STATE
    rate_hz: [20, 50]
    external_type: true
    constraint: "左侧真空表压，单位 Pa，负值为真空（偏离 FluidPressure 标准的绝压定义）；p<=-60000 Pa 为建立、p>=-1000 Pa 为释放，由消费方按此阈值判定；stamp 为样本时间；通信失败停发，由 R-OUT-20 报错"

  - id: R-OUT-05R
    ros_name: /rt/vacuum/right/pressure
    kind: topic
    type: sensor_msgs/msg/FluidPressure
    producer: rt_control
    consumers: [motion, autonomy]
    qos: Q_STATE
    rate_hz: [20, 50]
    external_type: true
    constraint: "右侧真空表压，单位 Pa，负值为真空（偏离 FluidPressure 标准的绝压定义）；p<=-60000 Pa 为建立、p>=-1000 Pa 为释放，由消费方按此阈值判定；stamp 为样本时间；通信失败停发，由 R-OUT-20 报错"

  - id: R-OUT-19A
    ros_name: /rt/ultrasonic/channel1/range
    kind: topic
    type: sensor_msgs/msg/Range
    producer: rt_control
    consumers: [autonomy]
    qos: Q_FAST_STATE
    max_age_ms: 2500
    external_type: true
    constraint: "米制距离；通信失败停发并由状态接口立即报错；年龄超过 2.5 s 过期；无目标 +Inf，协议异常 NaN"


  - id: R-OUT-19B
    ros_name: /rt/ultrasonic/channel2/range
    kind: topic
    type: sensor_msgs/msg/Range
    producer: rt_control
    consumers: [autonomy]
    qos: Q_FAST_STATE
    max_age_ms: 2500
    external_type: true
    constraint: "同 R-OUT-19A；通道与安装外参须由版本化配置确认"


  - id: R-OUT-19C
    ros_name: /rt/ultrasonic/channel3/range
    kind: topic
    type: sensor_msgs/msg/Range
    producer: rt_control
    consumers: [autonomy]
    qos: Q_FAST_STATE
    max_age_ms: 2500
    external_type: true
    constraint: "同 R-OUT-19A；通道与安装外参须由版本化配置确认"


  - id: R-OUT-19D
    ros_name: /rt/ultrasonic/channel4/range
    kind: topic
    type: sensor_msgs/msg/Range
    producer: rt_control
    consumers: [autonomy]
    qos: Q_FAST_STATE
    max_age_ms: 2500
    external_type: true
    constraint: "同 R-OUT-19A；通道与安装外参须由版本化配置确认"


  - id: R-OUT-19E
    ros_name: /rt/ultrasonic/channel5/range
    kind: topic
    type: sensor_msgs/msg/Range
    producer: rt_control
    consumers: [autonomy]
    qos: Q_FAST_STATE
    max_age_ms: 2500
    external_type: true
    constraint: "米制距离；第二 E08 独立发布，第一模块失败不得阻止本侧；其余同 R-OUT-19A"


  - id: R-OUT-19F
    ros_name: /rt/ultrasonic/channel6/range
    kind: topic
    type: sensor_msgs/msg/Range
    producer: rt_control
    consumers: [autonomy]
    qos: Q_FAST_STATE
    max_age_ms: 2500
    external_type: true
    constraint: "同 R-OUT-19E；通道与安装外参须由版本化配置确认"


  - id: R-OUT-19G
    ros_name: /rt/ultrasonic/channel7/range
    kind: topic
    type: sensor_msgs/msg/Range
    producer: rt_control
    consumers: [autonomy]
    qos: Q_FAST_STATE
    max_age_ms: 2500
    external_type: true
    constraint: "同 R-OUT-19E；通道与安装外参须由版本化配置确认"


  - id: R-OUT-19H
    ros_name: /rt/ultrasonic/channel8/range
    kind: topic
    type: sensor_msgs/msg/Range
    producer: rt_control
    consumers: [autonomy]
    qos: Q_FAST_STATE
    max_age_ms: 2500
    external_type: true
    constraint: "同 R-OUT-19E；通道与安装外参须由版本化配置确认"


  - id: R-OUT-29
    ros_name: /rt/base/wheel_observations
    kind: topic
    type: robot_rt_control_interfaces/msg/WheelObservationArray
    producer: rt_control
    consumers: [navigation]
    qos: Q_FAST_STATE
    rate_hz: [100, 100]
    note: "逐轮观测，供导航逐轮融合；与 R-OUT-02 同源，导航不得把两者同时作为独立观测"
    constraint: "只发硬件实测反馈，不发指令或融合速度；四轮固定 FL/FR/RL/RR 且带 wheel_id；行走位置与速度同一样本；两路转向角分开、无效不互相填补；逐通道采样时间、时间来源、样本序号与连续性代号，重复样本不刷新时间和序号；底盘失能时照常发布"

  - id: R-OUT-30
    ros_name: /rt/base/terminal_rotation_active
    kind: topic
    type: std_msgs/msg/Bool
    producer: rt_control
    consumers: [navigation, autonomy]
    qos: Q_CONTROL
    rate_hz: [50, 50]
    max_age_ms: 300
    external_type: true
    constraint: "Actual accepted terminal-rotation execution state, not an echo or completion signal; false on expired request, disable, fault, inactive lifecycle, or non-VELOCITY_READY; publish false while publisher is alive even when execution is disabled; absence is unknown, never active; see contract/navigation-execution-v1.md"

  - id: R-OUT-31
    ros_name: /rt/base/execution_state
    kind: topic
    type: std_msgs/msg/Float64MultiArray
    producer: rt_control
    consumers: [navigation, autonomy]
    qos: Q_FAST_STATE
    rate_hz: [100, 100]
    max_age_ms: 100
    external_type: true
    constraint: "Exactly 91 fields: v1 27 header + four 16-field modules; timestamp index1, sequence index2; unique physical module IDs1..4 permit block reorder; ready=1 requires all91 finite, status1/2/3, ROS age<=100ms and future<=10ms with advancing stamps; actual core TranslationBranch, Holding, Gate, Release and FlipHysteresis; wheel speed m/s; unavailable feedback stays NaN and invalid, never commands or stale data restamped; authoritative driver mapping/calibration unchanged; see contract/navigation-execution-v1.md"

  - id: R-OUT-31C
    ros_name: /rt_control/chassis/execution_state
    kind: topic
    type: std_msgs/msg/Float64MultiArray
    producer: rt_control
    consumers: [navigation, autonomy]
    qos: Q_FAST_STATE
    rate_hz: [100, 100]
    max_age_ms: 100
    external_type: true
    constraint: "Published Navigation v3.0.4 compatibility endpoint: identical v1 27+4x16 layout/data/sequence/ROS timestamp from the same captured snapshot as R-OUT-31; select one alias, never fuse both; SensorDataQoS-compatible; withdrawn undeployed PR24 layout must never be published or mixed on this endpoint"

  - id: R-OUT-32
    ros_name: /rt_control/chassis/joint_states
    kind: topic
    type: sensor_msgs/msg/JointState
    producer: rt_control
    consumers: [navigation, autonomy]
    qos: Q_FAST_STATE
    rate_hz: [100, 100]
    max_age_ms: 200
    external_type: true
    constraint: "Normalized measured feedback, not URDF /joint_states: module_1_steering/module_1_wheel through module_4_steering/module_4_wheel, matched by name; measured body heading rad, measured wheel position rad and velocity rad/s; steering velocity from valid hardware or >=2 fresh actual angle observations: advancing hardware sequence/time when available, otherwise supported strict host receive-age fall at1kHz versus4ms SYNC with advancing reconstructed local receive time; duplicates never differenced, ambiguous/reset continuity clears history; no invented device timestamp/sequence; invalid rate NaN, never fallback0 or reference rate; effort empty; frame_id=base_footprint; ROS age<=200ms future<=50ms; SensorDataQoS-compatible; preserve authoritative model/calibration/mapping; see contract/navigation-execution-v1.md"


  - id: R-OUT-20
    ros_name: /rt/sensors/state
    kind: topic
    type: robot_rt_control_interfaces/msg/SensorStatusArray
    producer: rt_control
    consumers: [motion, autonomy]
    qos: Q_STATE
    constraint: "逐传感器声明有效、无目标、协议异常、通信错误、过期或未配置；每项保留真实样本时间，数组发布时间不刷新旧观测"


  - id: R-OUT-21
    ros_name: /rt/infrared/state
    kind: topic
    type: robot_rt_control_interfaces/msg/DigitalInputStateArray
    producer: rt_control
    consumers: [autonomy]
    qos: Q_STATE
    constraint: "手臂红外只表示目标检测开关量；逐通道标识、原始电平、语义状态和有效性；未知不得当成未检测，不直接触发运动停止"


  - id: R-OUT-22
    ros_name: /rt/imu/data
    kind: topic
    type: sensor_msgs/msg/Imu
    producer: rt_control
    consumers: [navigation]
    qos: Q_FAST_STATE
    external_type: true
    constraint: "由 navigation 域消费；SI 单位；时间为主机发布/接收链语义，不声明设备同步；无效拼接不重发旧测量；独立磁场不公开"


  - id: R-OUT-23L
    ros_name: /rt/force_torque/left_wrist/wrench
    kind: topic
    type: geometry_msgs/msg/WrenchStamped
    producer: rt_control
    consumers: [motion]
    qos: Q_FAST_STATE
    external_type: true
    constraint: "左传感器坐标系、N/Nm、经设备标定与单位换算；不做工具/箱子重力补偿、不自动调零；配置未闭合时不可宣称有效"


  - id: R-OUT-23R
    ros_name: /rt/force_torque/right_wrist/wrench
    kind: topic
    type: geometry_msgs/msg/WrenchStamped
    producer: rt_control
    consumers: [motion]
    qos: Q_FAST_STATE
    external_type: true
    constraint: "右传感器坐标系、N/Nm、经设备标定与单位换算；不做工具/箱子重力补偿、不自动调零；配置未闭合时不可宣称有效"


  - id: R-OUT-07
    ros_name: /rt/arms/rolling/state
    kind: topic
    type: robot_rt_control_interfaces/msg/RollingJointControlState
    producer: rt_control
    consumers: [motion]
    qos: Q_ROLLING_STATE
    rate_hz: [50, 50]
    max_age_ms: 200
    axis_set: v3_dual_arm
    note: "rolling 控制器激活期间发布；5 个字段：epoch、state、last_sequence、last_result、stop_reason"
    constraint: "每次激活 epoch 加 1；state 为 HOLDING（无轨迹）/STARTING（开始一段轨迹的批次已接受，等待其 replace_from）/RUNNING/STOPPING；last_sequence/last_result 只报本 epoch 最新收到的批次；stop_reason 为当前或最近一段轨迹的停止原因，自开始该段的批次被接受起为 STOP_NONE，停止后保持到下一段开始；final 轨迹执行到末点报 STOP_COMPLETED，由 RUNNING 直接进入 HOLDING；reliable/volatile/keep-last(5)，deadline 100 ms、lifespan 200 ms"


  - id: R-OUT-09
    ros_name: /rt/readiness
    kind: topic
    type: robot_system_interfaces/msg/DomainReadiness
    producer: rt_control
    consumers: [autonomy, motion]
    qos: Q_LATCHED
    rate_hz: [1, 1]
    constraint: "ready 表示 RT-Control 当前能接收指令：未使能、控制器或硬件未激活、设备离线或故障锁存均为 false，blockers 给出稳定标记；变化立即发；稳定 1 Hz"


  - id: R-OUT-28
    ros_name: /rt/capabilities
    kind: topic
    type: std_msgs/msg/String
    producer: rt_control
    consumers: [external]
    qos: Q_LATCHED
    external_type: true
    constraint: "JSON 对象：schema_version=1、control_scope、use_mock_hardware、capabilities（本作用域提供的能力名列表）、hardware；作用域启动时发布一次"

  - id: R-OUT-10
    ros_name: /diagnostics
    kind: topic
    type: diagnostic_msgs/msg/DiagnosticArray
    producer: rt_control
    consumers: [external]
    qos: Q_DIAGNOSTIC
    external_type: true
    note: 不得替代 Action Result 或 readiness 证据
    constraint: "`Q_DIAGNOSTIC`；不替代 Action Result、readiness 或硬安全链"

  # ---- V0.4 卸箱流程（Autonomy 编排）。流程与逐项要求见 robot_autonomy/docs。 ----

  - id: M-IF-02
    ros_name: /motion/pick_and_carry
    kind: action
    type: robot_motion_interfaces/action/PickAndCarry
    producer: motion
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "一个 Action 内完成检查、规划、接近、贴近、开阀、等吸附、抽离、进入运输位，不设独立可行性接口；tcp_target 为 base_link 下 TCP，Motion 不再叠加工具偏移；uses_wall_map=true 时 navigation_map_version、wall_producer_instance_id、wall_map_version 取自换算 TCP 所用的同一份视觉快照引用，其中 navigation_map_version 是视觉的物理地图身份，不是导航语义地图版本；Motion 不启停泵；开阀后收到参与侧 p<=-60 kPa 的有效新压力样本即抽离，不加固定延时或多帧稳定等待，抽离不需要 Autonomy 批准；source_observed_at 只作记录，不作为拒绝条件；分臂给出成功/失败/取消/未知，一侧成功一侧失败时 overall=PARTIAL 并以 ABORTED 返回，保留成功侧事实；同时只接受一个 Goal，忙时拒绝；取消时手臂原地停下并确认停稳，以 CANCELED 返回，不自动松阀、不关泵、不回 Home；purpose=DROPPED_BOX_RECOVERY 使用地面回收场景配置；Goal.next 为按执行顺序预发送的 0–2 组后续 PickPair，只预规划不执行，真正执行时另发 Goal 并以 context.operation_id 对应，内容、前序结果、起点、TCP（≤2 mm/0.5°）或邻箱场景（≤2 mm）任一不符即现场重规划；next_plan_states/next_plan_errors 与 next 同长同序，是状态不是事件，每条 Feedback 与 Result 都带完整值；used_precomputed_plan 只作追溯；M-IF-06/M-IF-07 清空预规划缓存；箱墙快照由 Autonomy 放在 Goal.wall_map 随请求下发，Motion 不读视觉的 P-IF-03/04；uses_wall_map=true 的组要求 wall_map.reference 与其三项快照引用完全一致，缺失或不一致报 MOTION_WALL_MAP_UNAVAILABLE 且不回退到其他版本（预规划组只把该组判 FAILED），坐标用 PickPair.base_pose_at_target_generation 从 map 换算；uses_wall_map 全为 false 时 wall_map 留空，按先验建模；Autonomy 沿用旧版本快照时，可在下发的副本里把它已知搬走的箱子（已抓走、人工标记搬走）的 lifecycle_state 置为 REMOVED_CONFIRMED，reference 与其余内容不变，Motion 按契约丢弃已确认移除的箱子，本组和 next 的目标不得被这样标记；目标相关箱体重叠报 MOTION_WALL_MAP_OVERLAP（>40 mm 为 FAULT 且不规划）；warnings[] 报告不阻断执行的业务警告；经 M-IF-06 终止时 Action 以 ABORTED 结束、业务结果为取消"

  - id: M-IF-03
    ros_name: /motion/place_carried_boxes
    kind: action
    type: robot_motion_interfaces/action/PlaceCarriedBoxes
    producer: motion
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "前提是导航已到卸货朝向并停稳；顺序为 LM 运动到 Motion 配置的默认放置位、关闭所选阀并读回确认、延时、回 Home、确认停稳；不关泵；允许只释放实际仍持箱的一侧，并按剩余载荷规划；箱 ID 与持箱记录不一致时在释放前拒绝；阀已释放但回 Home 失败时整体不成功，保留已释放的事实，不重新释放；取消时手臂原地停下并确认停稳，以 CANCELED 返回，不松阀、不回 Home，不反转已释放的输出；warnings[] 报告不阻断执行的业务警告；经 M-IF-06 终止时 Action 以 ABORTED 结束、业务结果为取消"

  - id: M-IF-05
    ros_name: /motion/state
    kind: topic
    type: robot_motion_interfaces/msg/ManipulationState
    producer: motion
    consumers: [autonomy]
    qos: Q_STATE
    rate_hz: [10, 10]
    constraint: "持续发布执行事实：当前操作、分臂阶段、关联箱 ID、吸附事实、阀输出是否已确认释放、上部是否停稳；Action 结束后继续发布；持箱与否的业务判断由 Autonomy 做；各项观测带自己的时间，重发不刷新旧观测时间；warnings[] 报告业务警告和阻断故障，error 只表达任务级错误"

  - id: N-IF-16
    ros_name: /navigation/detect_dropped_boxes
    kind: action
    type: robot_navigation_interfaces/action/DetectDroppedBoxes
    producer: navigation
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "一个 Goal 执行一轮检测，不常驻监听；必须能检出请求发出前已经落地的箱子；Autonomy 判定掉箱后先取消在途导航与运控动作再立即发起；reference_valid=true 时 reference_stamp 是掉箱前仍在吸附的时刻再提前 1 s（电控压力消息头时钟），导航须保留至少 5 s 的点云/高度图历史以便回看该时刻（导航已确认）；导航 Goal 被取消时先停车再以 CANCELED 结束（见 N-01）；reference_valid=false 时按无基准方式检测，不得拒绝；同时只接受一个 Goal；有效完成且有候选：SUCCEEDED/ok=true/detected=true；有效完成无候选：SUCCEEDED/ok=true/detected=false；点云不可用、TF 失败或超时：ABORTED/ok=false，不能当作现场无箱；取消：CANCELED，只停检测，不发停车指令；超时计时独立于点云回调；结果只在 Result 里一次返回；候选为 odom 下粗定位，数量不限于 2"

  - id: P-IF-01
    ros_name: /perception/set_sku_catalog
    kind: service
    type: robot_perception_interfaces/srv/SetSkuCatalog
    producer: perception
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "标称尺寸单位米，按箱体局部轴 X 宽/Y 深/Z 高；至少两个轴为有限正数，未知轴填 0，负数、NaN、Inf 拒绝；dimension_tolerance_known=false 时用视觉默认容差 0.04 m，为 true 时容差为有限非负数；目录只描述箱型，不含数量；本箱实测轴唯一匹配 SKU 后，缺失轴可用至少两个同 SKU 已确认箱子的可靠一致实测补为先验，不改目录、不标成实测；SKU ID 唯一；观测进行中拒绝设置，调用方等本轮结束后重试；同 ID 同版本但内容不同时拒绝，相同内容重复设置返回已加载结果；accepted 只表示字典已加载，不表示已有箱子快照；一次观测内不混用两版字典"

  - id: P-IF-03
    ros_name: /perception/get_wall_map
    kind: service
    type: robot_perception_interfaces/srv/GetWallMap
    producer: perception
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "只读已有数据：不拍照、不转头、不等待新观测；返回 map 下全局箱子库的全部箱子，不按场景或墙面筛选；库未建好时 success=false，已确认的空库 success=true 且 boxes 为空；首次自动搜索期间可读到中间快照，Autonomy 以 readiness wall_observation 判断首次搜索已完成；一次响应只对应一个已提交版本；重复读取不递增版本、不刷新观测时间；精确读取不存在的版本时失败，不回退到最新；map 坐标身份由视觉部署配置，不订阅导航定位状态；观测必须有真实曝光时 TF；单文件恢复保留箱号、三心与原观测时间，恢复后 grasp_candidate=false 直到重新观测"

  - id: P-IF-04
    ros_name: /perception/wall_map
    kind: topic
    type: robot_perception_interfaces/msg/WallMap
    producer: perception
    consumers: [autonomy, external]
    qos: Q_LATCHED
    constraint: "每次成功提交时发布完整 map 全局快照；晚加入的订阅者收到最近一份；Autonomy 的正常更新以 P-IF-08 的 Result 为准；每箱包含独立有效的面心/顶心/体心，均为箱体轴 X 宽/Y 向内/Z 高；面心为 -Y 面中心，顶心为 +Z 面中心；未知深度不得伪造体心，也不使可靠面心失效；侧吸从面心、顶吸从顶心生成 TCP，发送时使用当前 map 到 base_link TF，不维护 base_link 箱体快照"

  - id: P-IF-05
    ros_name: /perception/wall_map_status
    kind: topic
    type: robot_perception_interfaces/msg/WallMapStatus
    producer: perception
    consumers: [autonomy, external]
    qos: Q_STATE
    constraint: "最近提交的快照引用、当前更新阶段、最近一次尝试的结果；仅作可观测性，不作为主流程握手"

  - id: P-IF-06
    ros_name: /perception/recognize_dropped_boxes
    kind: action
    type: robot_perception_interfaces/action/RecognizeDroppedBoxes
    producer: perception
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "每次 1 或 2 个区域，各数组同长同序；detection_goal_id 为导航检测的 Goal UUID，原样返回；按候选观测时刻的 TF 把 odom 下 XY 转到 map；必须配置真实的地面高度和搜索高度，缺失时明确失败，不假设 z=0；候选区域必须进入相机视野；输出 map 下箱体中心、朝向和尺寸；看不到时返回 NOT_OBSERVABLE，不报 NOT_FOUND；不修改正常箱子库；与 P-IF-08 共用相机和头部，冲突时后到的请求返回忙；navigation_map_version 填快照里的 map 坐标身份；与 P-IF-08 和首次搜索互斥，忙时拒绝、不排队，Autonomy 等在途更新结束且 readiness dropped_box_recognition 就绪后再发"

  - id: P-IF-14
    ros_name: /perception/finish_wall_observation
    kind: service
    type: robot_perception_interfaces/srv/FinishWallObservation
    producer: perception
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "结束正在进行的 P-IF-08 的采样，用已采到的有效帧继续离线处理，结果仍由 P-IF-08 的 Result 返回；与取消不同，不放弃本次更新；采样真正停止（不再接收新帧、头部已停稳）后才返回，返回后 Feedback.capture_complete 同为 true；视觉已自行结束采样时也返回 accepted=true；operation_id 与正在进行的更新不匹配或没有更新在进行时拒绝；有效帧是否足够由视觉判断，不足时 P-IF-08 以 map_committed=false 结束"

  - id: P-IF-08
    ros_name: /perception/update_wall_map
    kind: action
    type: robot_perception_interfaces/action/UpdateWallMap
    producer: perception
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "Autonomy 在 PickAndCarry 整组终态且有成功侧到运输位后发一次；必须是受理之后取得的新观测；Result 直接带本次提交的完整快照，调用方不再读取箱墙；是否更新看 map_committed，提交后被取消或出故障仍返回已提交快照，提交前失败则旧库不变；不提供强制删箱，不返回逐箱移除核对，箱子是否移除由视觉证据决定；expected_map 版本比当前旧可接受，超前则拒绝；抓后更新填 successfully_carried_box_ids（只填停止确认有效的成功侧），切换为 after_pick 观察；采集结束前底盘不得转向，usable_view_obtained 不是底盘运动许可；抓后观察只用一个视角，看不全的部分留给下一次更新；Feedback 进入 CAPTURING 起由 Autonomy 计采样时长；视觉凑够有效帧即自行结束采样，到了 Autonomy 配置的上限（当前 2 s）仍未结束时由 Autonomy 调用 P-IF-14 结束；capture_complete=true 表示采样已结束、头部已停稳并释放，是底盘可以转向的信号，之后的离线处理（约 4～6 s）与转向、卸货并行；有效帧不足时 map_committed=false，Autonomy 继续用旧快照"


  # ---- 联调操作页：重置与显示 ----

  - id: M-IF-04
    ros_name: /motion/move_to_posture
    kind: action
    type: robot_motion_interfaces/action/MoveToPosture
    producer: motion
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "posture_id=home 时回到默认 Home；是否空载、是否适合移动由调用方 Autonomy 在发 Goal 前判断（操作员确认、两侧阀与泵已关并读回、两侧压力样本有效且已释放），Motion 不以压力或旧任务记录拒绝；从实时实测关节起点规划、碰撞检查并时间化后执行；不启停泵、不动阀；取消须确认停稳，客户端取消为 CANCELED，经 M-IF-06 终止时为 ABORTED 但业务为停止；不清旧任务记录，由 M-IF-07 负责"

  - id: M-IF-06
    ros_name: /motion/terminate_task
    kind: service
    type: robot_motion_interfaces/srv/TerminateTask
    producer: motion
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "只停止当前任务并确认停稳，独立于各 Action 的取消；context.attempt_id 必须等于当前活动任务的 attempt_id，无匹配的活动任务时 accepted=false（空闲时调用方不应调用，需清记录直接用 M-IF-07）；不清理任务记录、不松阀、不关泵、不回 Home、不规划新动作；在途的 PickAndCarry、PlaceCarriedBoxes、MoveToPosture、MoveJoints、MoveDualTcp 结束，ROS 终态为 ABORTED，业务结果为取消；accepted 只表示受理，等到 RT 终态和真实关节反馈确认停稳后才返回 stopped=true 且 stop_confirmation_valid=true；停稳确认超时返回 stopped=false、stop_confirmation_valid=false 并在 error 说明；之后须经 M-IF-07 清理才受理新任务"

  - id: M-IF-07
    ros_name: /motion/reset_task
    kind: service
    type: robot_motion_interfaces/srv/ResetTask
    producer: motion
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "context.attempt_id 必须等于最近一次任务（已结束或已被 M-IF-06 停稳）的 attempt_id，不匹配时 accepted=false；只要求没有执行中任务、没有受理中或终态未确认的 RT 目标；清理目标集合、持箱记录和任务锁；不移动、不松阀、不关泵、不清 RT 故障、不清 attempt 去重记录；不检查压力或额外停稳窗口；现场负载处置由上层负责；M-IF-02/03/04/09/10 任一 Action 失败或被取消后，Motion 拒绝新的 Goal 并在 M-06 的 blockers 中给出 reset_required，直到本接口清理成功；Autonomy 在运控动作未成功后自动调用本接口"

  - id: M-IF-08
    ros_name: /motion/get_end_effector_pose_at_time
    kind: service
    type: robot_motion_interfaces/srv/GetEndEffectorPoseAtTime
    producer: motion
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "查询指定操作事件时刻的 TCP；reference_frame 仅支持 base_link；只使用前后真实关节反馈样本插值，不外推、不用当前位姿替代；事件来源/实例/序号只用于关联追溯；无支持样本时 pose_valid=false 并在 per_arm_errors 说明；不改变业务状态"

  - id: M-IF-09
    ros_name: /motion/move_joints
    kind: action
    type: robot_motion_interfaces/action/MoveJoints
    producer: motion
    consumers: [autonomy, external]
    qos: Q_DEFAULT
    constraint: "调试/人工操作用，非节拍流程；joint_names 必须恰为 arm_carriage、left_joint1..7、right_joint1..7 共 15 个且不重复，positions 一一对应，升降 m、臂 rad；目标超出关节位置限位直接拒绝不裁剪；从实时实测关节起点做关节空间直线插值，不做任何碰撞检测，空间安全由调用方负责；按空载时间化，臂关节速度上限 15 deg/s，升降及其余动力学限制沿用 Motion 配置；不启停泵、不动阀；同时只接受一个 Goal，与 M-IF-02/03/04/10 互斥，忙时拒绝；执行完成、停稳且实测与目标在到位容差内才 target_reached=true；取消、终止与停稳确认语义同 M-IF-04"

  - id: M-IF-10
    ros_name: /motion/move_tcp
    kind: action
    type: robot_motion_interfaces/action/MoveDualTcp
    producer: motion
    consumers: [autonomy, external]
    qos: Q_DEFAULT
    constraint: "调试/人工操作用，非节拍流程；至少一侧 enabled；目标为 base_link 下 left_tool0/right_tool0 的 TCP 位姿，Motion 不叠加工具偏移，stamp 只追溯不做时效拒绝；从实时实测关节状态求 15 轴逆解（升降参与），在位姿容差与关节位置限位内取离当前状态加权关节距离最小的解，升降 0.15 m 与臂关节 60 deg 等价；未启用侧 7 轴保持当前值；无解返回 MOTION_IK_NO_SOLUTION 且不运动；之后关节空间直线运动，TCP 路径非直线，不做任何碰撞检测，空间安全由调用方负责；按空载时间化，臂关节速度上限 15 deg/s，升降及其余动力学限制沿用 Motion 配置；不启停泵、不动阀；同时只接受一个 Goal，与 M-IF-02/03/04/09 互斥，忙时拒绝；取消、终止与停稳确认语义同 M-IF-04"

  - id: P-IF-09
    ros_name: /perception/camera/head/color/image_rect/compressed
    kind: topic
    type: sensor_msgs/msg/CompressedImage
    producer: perception
    consumers: [autonomy, external]
    qos: Q_SENSOR
    external_type: true
    constraint: "头部彩色图，JPEG；视觉栈启动、相机出图后持续发布，不需要请求；只发布新曝光，输入停止后不重发旧图，订阅端按接收时间判断断流；不低于 2 Hz，长边不超过 1280 像素；header.stamp 为曝光时刻，不是编码或发送时刻；header.frame_id 为相机光学坐标系；`Q_SENSOR`，订阅端不得用 reliable"

  - id: P-IF-10
    ros_name: /perception/camera/chest/color/image_rect/compressed
    kind: topic
    type: sensor_msgs/msg/CompressedImage
    producer: perception
    consumers: [autonomy, external]
    qos: Q_SENSOR
    external_type: true
    constraint: "胸部彩色图，其余同 P-IF-09；胸部相机随视觉栈默认开启"

  - id: P-IF-11
    ros_name: /perception/boxes/head/image_annotated/compressed
    kind: topic
    type: sensor_msgs/msg/CompressedImage
    producer: perception
    consumers: [autonomy, external]
    qos: Q_SENSOR
    external_type: true
    constraint: "头部标注图，每个箱子上写箱号，已确认的箱号与同曝光对应快照里的 box_id 一致；身份未核实时显示 pending，不借用其他帧的箱号；为匹配地图结果约有 2.5 s 延迟，与彩色原图可能不是同一曝光；仅供人看，不得从图上识别箱号作为抓取指令；其余同 P-IF-09"

  - id: P-IF-12
    ros_name: /perception/camera/head/camera_info
    kind: topic
    type: sensor_msgs/msg/CameraInfo
    producer: perception
    consumers: [autonomy, external]
    qos: Q_SENSOR
    external_type: true
    constraint: "头部相机内参，与 P-IF-09 同一相机；内参为原始采集分辨率（width/height 为原始尺寸），压缩图可能缩小，使用方按压缩图与内参的尺寸比例缩放焦距和主点后再做像素投影；`Q_SENSOR`"

  - id: P-IF-13
    ros_name: /perception/camera/chest/camera_info
    kind: topic
    type: sensor_msgs/msg/CameraInfo
    producer: perception
    consumers: [autonomy, external]
    qos: Q_SENSOR
    external_type: true
    constraint: "胸部相机内参，与 P-IF-10 同一相机，其余同 P-IF-12"

