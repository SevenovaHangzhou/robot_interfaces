# 跨域 endpoint 注册表。
#
# 本文是 endpoint、类型、提供方、消费方、QoS 与关键约束的唯一注册表，
# 由 tools/contract_gate.py 做双向闭合校验：
#   - 本仓库每个 .msg/.srv/.action 必须被至少一个 endpoint 引用
#   - 每个 endpoint 的 type 必须真实存在于本仓库或声明为外部标准类型
#
# Wire schema 由本仓库对应 IDL 定义。不在本表中的跨域 endpoint 视为未授权。
# 域取值：rt_control / perception / motion / autonomy / external

version: "0.6.0"

domains: [rt_control, perception, motion, autonomy, external]

# 自定义 IDL 按 endpoint 提供方所属域唯一归档。shared 只承载四域共用
# 的基础载荷，不代表第五个业务域。消费域直接依赖提供方包，不复制 IDL。
package_owners:
  robot_system_interfaces: shared
  robot_rt_control_interfaces: rt_control
  robot_perception_interfaces: perception
  robot_motion_interfaces: motion
  robot_autonomy_interfaces: autonomy

qos_profiles: [Q_CONTROL, Q_FAST_STATE, Q_STATE, Q_LATCHED, Q_DIAGNOSTIC, Q_DEFAULT]

endpoints:
  - id: G-01
    ros_name: /autonomy/execute_demo_task
    kind: action
    type: robot_autonomy_interfaces/action/ExecuteDemoTask
    producer: autonomy
    consumers: [external]
    qos: Q_DEFAULT
    constraint: "同时只接受一个活动 Goal，第二个在 Goal 响应阶段 reject；终态三选一"

  - id: P-01
    ros_name: /perception/build_wall_task_plan
    kind: action
    type: robot_perception_interfaces/action/BuildWallTaskPlan
    producer: perception
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "真实单次同步采集；25 箱；固定 15 序列；箱 pose 为吸取表面接触位姿；每序列自带 `station_id`、统一 0.74 m 退避的 `station_nav_pose(map)`、按臂绑定重拍位；每个 G-01 只调用一次；严格成功"

  - id: P-02
    ros_name: /perception/refine_sequence_poses
    kind: action
    type: robot_perception_interfaces/action/RefineSequencePoses
    producer: perception
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "同箱同序；返回吸取表面接触位姿；`base_link`；stamp=真实曝光时刻；底盘静止、TF、标定不变"

  - id: P-03
    ros_name: /perception/obstacle_cloud
    kind: topic
    type: robot_perception_interfaces/msg/ObstacleCloud
    producer: perception
    consumers: [motion]
    qos: Q_STATE
    reserved: true
    constraint: "**产品预留**；Demo 不部署、不订阅、不依赖"

  - id: P-04
    ros_name: /perception/readiness
    kind: topic
    type: robot_system_interfaces/msg/DomainReadiness
    producer: perception
    consumers: [autonomy]
    qos: Q_LATCHED
    rate_hz: [1, 1]
    constraint: "`Q_LATCHED`；故障立即 `ready=false`；变化立即发；稳定 1 Hz"

  - id: P-NAV-01
    ros_name: /odom
    kind: topic
    type: nav_msgs/msg/Odometry
    producer: motion
    consumers: [perception, autonomy]
    qos: Q_FAST_STATE
    rate_hz: [50, 50]
    max_age_ms: 200
    external_type: true
    constraint: "Navigation/Motion 发布融合里程计；50 Hz；最大年龄 200 ms；Perception 可用于定位/视觉时空对齐；**最终停稳证据**"

  - id: P-NAV-02
    ros_name: /tf
    kind: topic
    type: tf2_msgs/msg/TFMessage
    producer: motion
    consumers: [perception, autonomy]
    qos: Q_DEFAULT
    external_type: true
    note: map → odom 由 Navigation/Motion 发布；Perception 通过 TF 查询 map→odom
    constraint: "map→odom 定位边唯一发布者为 Navigation/Motion；/tf 按坐标边判唯一性"
    multi_producer: true  # /tf 按坐标边判唯一性，见契约 6.11

  - id: N-01
    ros_name: /navigation/navigate_to_pose
    kind: action
    type: robot_motion_interfaces/action/NavigateToPoseTask
    producer: motion
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "`target_name + map_version` 由 Motion 通过语义地图解析为 Nav2 目标；真实调用 Nav2；最多总调用三次"

  - id: N-04
    ros_name: /cmd_vel_safe
    kind: topic
    type: geometry_msgs/msg/Twist
    producer: motion
    consumers: [rt_control]
    qos: Q_CONTROL
    rate_hz: [20, 50]
    watchdog_ms: 500
    external_type: true
    note: Twist 无 header；看门狗只用本地接收间隔，不得推导 stamp 或 frame
    constraint: "见 R-IN-01；Motion 是唯一生产者"

  - id: N-05
    ros_name: /navigation/localization/status
    kind: topic
    type: robot_motion_interfaces/msg/LocalizationStatus
    producer: motion
    consumers: [autonomy]
    qos: Q_STATE
    rate_hz: [10, 20]
    max_age_ms: 200
    constraint: "发布者唯一；10～20 Hz；最大年龄 200 ms"

  - id: N-10
    ros_name: /navigation/semanticmap/landmark_array
    kind: topic
    type: robot_motion_interfaces/msg/LandmarkArray
    producer: motion
    consumers: [perception, autonomy, external]
    qos: Q_STATE
    constraint: "当前语义地图地标列表；按 map_version 区分地图版本"

  - id: N-11
    ros_name: /navigation/semanticmap/add_landmark
    kind: service
    type: robot_motion_interfaces/srv/AddLandmark
    producer: motion
    consumers: [perception, external]
    qos: Q_DEFAULT
    constraint: "按指定位姿新增语义地标；返回 used_map_version 与最终地标"

  - id: N-12
    ros_name: /navigation/semanticmap/add_current_landmark
    kind: service
    type: robot_motion_interfaces/srv/AddCurrentLandmark
    producer: motion
    consumers: [perception, external]
    qos: Q_DEFAULT
    constraint: "以当前 base_footprint 位姿新增语义地标；返回 used_map_version 与最终地标"

  - id: N-13
    ros_name: /navigation/semanticmap/update_landmark
    kind: service
    type: robot_motion_interfaces/srv/UpdateLandmark
    producer: motion
    consumers: [perception, external]
    qos: Q_DEFAULT
    constraint: "更新语义地标属性和位姿；返回 used_map_version 与最终地标"

  - id: N-14
    ros_name: /navigation/semanticmap/remove_landmark
    kind: service
    type: robot_motion_interfaces/srv/RemoveLandmark
    producer: motion
    consumers: [perception, external]
    qos: Q_DEFAULT
    constraint: "按 name 删除指定 map_version 内的语义地标"

  - id: N-15
    ros_name: /navigation/semanticmap/get_landmark
    kind: service
    type: robot_motion_interfaces/srv/GetLandmark
    producer: motion
    consumers: [perception, autonomy, external]
    qos: Q_DEFAULT
    constraint: "按 target_name 查询语义地标；N-01 服务端用它解析导航目标"

  - id: N-16
    ros_name: /navigation/semanticmap/get_map
    kind: service
    type: robot_motion_interfaces/srv/GetSemanticMap
    producer: motion
    consumers: [perception, autonomy, external]
    qos: Q_DEFAULT
    constraint: "查询指定 map_version 下全部语义地标"

  - id: M-01
    ros_name: /motion/move_to_camera_view_pose
    kind: action
    type: robot_motion_interfaces/action/MoveToCameraViewPose
    producer: motion
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "转发 P-01 的重拍位，Motion 不重新解算；1～2 目标；同集同序；每序列只调用一次"

  - id: M-02
    ros_name: /motion/plan_and_execute_pick
    kind: action
    type: robot_motion_interfaces/action/PlanAndExecutePick
    producer: motion
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "精位姿必须新鲜；每序列一次；Result 载荷等级 `UNVERIFIED`"

  - id: M-03
    ros_name: /motion/plan_and_execute_place
    kind: action
    type: robot_motion_interfaces/action/PlanAndExecutePlace
    producer: motion
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "固定放置配置；每序列一次；**不可重放**；Result 载荷等级 `UNVERIFIED`"

  - id: M-06
    ros_name: /motion/readiness
    kind: topic
    type: robot_system_interfaces/msg/DomainReadiness
    producer: motion
    consumers: [autonomy]
    qos: Q_LATCHED
    rate_hz: [1, 1]
    constraint: "机械能力准入；变化立即发；稳定 1 Hz"

  - id: N-06
    ros_name: /navigation/readiness
    kind: topic
    type: robot_system_interfaces/msg/DomainReadiness
    producer: motion
    consumers: [autonomy]
    qos: Q_LATCHED
    rate_hz: [1, 1]
    constraint: "导航执行能力准入；变化立即发；稳定 1 Hz"

  - id: R-IN-02
    ros_name: /whole_body_jtc/follow_joint_trajectory
    kind: action
    type: control_msgs/action/FollowJointTrajectory
    producer: rt_control
    consumers: [motion]
    qos: Q_DEFAULT
    external_type: true
    note: 完整 14 轴；allow_partial_joints_goal=false
    constraint: "完整 14 轴；`allow_partial_joints_goal=false`；整组取消"

  - id: R-IN-03
    ros_name: /control/set_enabled
    kind: service
    type: robot_rt_control_interfaces/srv/SetControlEnabled
    producer: rt_control
    consumers: [external]
    qos: Q_DEFAULT
    constraint: "不复位急停、安全继电器或 STO；不属于箱级任务流程"

  - id: R-IN-04
    ros_name: /vacuum/pump/set_enabled
    kind: service
    type: robot_rt_control_interfaces/srv/SetPumpEnabled
    producer: rt_control
    consumers: [external]
    qos: Q_DEFAULT
    constraint: "活动真空命令或可能持箱时拒绝普通停泵"

  - id: R-IN-05
    ros_name: /vacuum/grip
    kind: action
    type: robot_rt_control_interfaces/action/VacuumGrip
    producer: rt_control
    consumers: [motion]
    qos: Q_DEFAULT
    constraint: "通道固定 `left/right` 且同数量/同集/同序；当前只接受 `grip_profile_id=default`；GRIP 每通道新鲜 `attached=true`；RELEASE 仍 `UNVERIFIED`"

  - id: R-OUT-01
    ros_name: /tf
    kind: topic
    type: tf2_msgs/msg/TFMessage
    producer: rt_control
    consumers: [perception, motion, autonomy]
    qos: Q_DEFAULT
    external_type: true
    note: robot_state_publisher 发布本体动态 TF
    constraint: "本体动态坐标边唯一；`map→odom` 与 `odom→base_footprint` 不由本域发布"
    multi_producer: true  # /tf 按坐标边判唯一性，见契约 6.11

  - id: R-OUT-01S
    ros_name: /tf_static
    kind: topic
    type: tf2_msgs/msg/TFMessage
    producer: rt_control
    consumers: [perception, motion, autonomy]
    qos: Q_LATCHED
    external_type: true
    note: robot_state_publisher 发布本体固定坐标边
    constraint: "本体固定坐标边唯一；`Q_LATCHED`；与 `/tf` 分开登记"

  - id: R-OUT-02
    ros_name: /wheel/odom
    kind: topic
    type: nav_msgs/msg/Odometry
    producer: rt_control
    consumers: [perception]
    qos: Q_FAST_STATE
    rate_hz: [50, 50]
    max_age_ms: 200
    external_type: true
    note: frame_id=odom，child_frame_id=base_footprint；rt-control 不发 odom→base_footprint TF
    constraint: "`frame_id=odom`、`child_frame_id=base_footprint`；`Q_FAST_STATE`；50 Hz；**不作为到站或停稳最终证据**"

  - id: R-OUT-03
    ros_name: /joint_states
    kind: topic
    type: sensor_msgs/msg/JointState
    producer: rt_control
    consumers: [motion, perception, autonomy]
    qos: Q_FAST_STATE
    rate_hz: [100, 100]
    note: 只含 14 个 EtherCAT 机械轴，不含履带控制关节
    max_age_ms: 200
    external_type: true
    constraint: "只含 14 个 EtherCAT 机械轴，不含履带关节；仅 position；`Q_FAST_STATE`；100 Hz"

  - id: R-OUT-04
    ros_name: /battery_state
    kind: topic
    type: sensor_msgs/msg/BatteryState
    producer: rt_control
    consumers: [autonomy]
    qos: Q_STATE
    rate_hz: [0.2, 0.2]
    note: BMS 周期 5 s；只读，不作为业务控制入口
    external_type: true
    constraint: "BMS 周期 5 s（0.2 Hz）；只读，不作为业务控制入口"

  - id: R-OUT-05
    ros_name: /vacuum/state
    kind: topic
    type: robot_rt_control_interfaces/msg/VacuumState
    producer: rt_control
    consumers: [autonomy]
    qos: Q_STATE
    rate_hz: [20, 50]
    constraint: "`Q_STATE`；20～50 Hz；发布 `left/right` 新鲜 `attached` 布尔状态；只 RT-Control 用于 GRIP 判定；Motion 不订阅"

  - id: R-OUT-06
    ros_name: /control/safety_state
    kind: topic
    type: robot_rt_control_interfaces/msg/SafetyState
    producer: rt_control
    consumers: [perception, motion, autonomy]
    qos: Q_STATE
    rate_hz: [10, 50]
    max_age_ms: 200
    constraint: "**软件可观测摘要，不含硬安全链状态**；`Q_STATE`；10～50 Hz；最大年龄 200 ms；`safe_to_start_motion=false` 或过期时禁止新动作"

  - id: R-OUT-09
    ros_name: /rt_control/readiness
    kind: topic
    type: robot_system_interfaces/msg/DomainReadiness
    producer: rt_control
    consumers: [autonomy]
    qos: Q_LATCHED
    rate_hz: [1, 1]
    constraint: "故障立即 `ready=false`；变化立即发；稳定 1 Hz"

  - id: R-OUT-10
    ros_name: /diagnostics
    kind: topic
    type: diagnostic_msgs/msg/DiagnosticArray
    producer: rt_control
    consumers: [external]
    qos: Q_DIAGNOSTIC
    external_type: true
    note: 不得替代 Action Result、readiness 或 SafetyState 证据
    constraint: "`Q_DIAGNOSTIC`；不替代 Action Result、SafetyState 或硬安全链"

# 成员类型：被上述 endpoint 的载荷间接引用，不单独出现在 ROS graph。
member_types:
  - robot_system_interfaces/msg/ErrorCode
  - robot_system_interfaces/msg/ErrorInfo
  - robot_motion_interfaces/msg/Landmark
  - robot_rt_control_interfaces/msg/VacuumChannelState
  - robot_rt_control_interfaces/msg/VacuumChannelResult
  - robot_rt_control_interfaces/msg/VacuumChannelFeedback
  - robot_perception_interfaces/msg/BoxPose
  - robot_perception_interfaces/msg/CameraViewPose
  - robot_perception_interfaces/msg/PickSequence
  - robot_perception_interfaces/msg/WallTaskPlan

# 禁止的通信边。各域 CI 与联调 ros2 node info 复核。
forbidden_edges:
  - {from: autonomy, to: /cmd_vel_safe}
  - {from: autonomy, to: /whole_body_jtc/follow_joint_trajectory}
  - {from: autonomy, to: /control/set_enabled}
  - {from: autonomy, to: /vacuum/pump/set_enabled}
  - {from: autonomy, to: /vacuum/grip}
  - {from: perception, to: /navigation/navigate_to_pose}

# 已删除的 endpoint。出现在 ROS graph 中即为违约。
# 底盘与手臂互斥是 Motion 域内不变量，不得重新做成跨域接口。
removed_endpoints:
  - /navigation/set_base_motion_inhibit
  - /robot_model/info
  - /calibration/info
  - /navigation/base_motion_gate_state
  - /motion/base_travel_readiness
  - /map
  - /navigation/scan
