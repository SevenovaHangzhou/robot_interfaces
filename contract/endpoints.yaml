    consumers: [autonomy]
    qos: Q_FAST_STATE
    max_age_ms: 2500
    external_type: true
    constraint: "同 R-OUT-19E；通道与安装外参须由版本化配置确认"


  - id: R-OUT-19H
    ros_name: /rt/ultrasonic/channel8/range
    kind: topic
    type: sensor_msgs/msg/Range
