  - id: R-OUT-20
    ros_name: /rt/sensors/state
    kind: topic
    type: robot_rt_control_interfaces/msg/SensorStatusArray
    producer: rt_control
    consumers: [motion, autonomy]
    qos: Q_STATE
    constraint: "逐传感器声明有效、无目标、协议异常、通信错误、过期或未配置；每项保留真实样本时间，数组发布时间不刷新旧观测"


  - id: R-OUT-21
    ros_name: /rt/infrared/state
    kind: topic
    type: robot_rt_control_interfaces/msg/DigitalInputStateArray
    producer: rt_control
    consumers: [autonomy]
    qos: Q_STATE
    constraint: "手臂红外只表示目标检测开关量；逐通道标识、原始电平、语义状态和有效性；未知不得当成未检测，不直接触发运动停止"


  - id: R-OUT-22
    ros_name: /rt/imu/data
    kind: topic
    type: sensor_msgs/msg/Imu
    producer: rt_control
    consumers: [motion]
    qos: Q_FAST_STATE
    external_type: true
    constraint: "当前 Navigation 职责由 motion 域消费；SI 单位；时间为主机发布/接收链语义，不声明设备同步；无效拼接不重发旧测量；独立磁场不公开"


  - id: R-OUT-23L
    ros_name: /rt/force_torque/left_wrist/wrench
    kind: topic
    type: geometry_msgs/msg/WrenchStamped
    producer: rt_control
    consumers: [motion]
    qos: Q_FAST_STATE
    external_type: true
    constraint: "左传感器坐标系、N/Nm、经设备标定与单位换算；不做工具/箱子重力补偿、不自动调零；配置未闭合时不可宣称有效"


  - id: R-OUT-23R
    ros_name: /rt/force_torque/right_wrist/wrench
    kind: topic
    type: geometry_msgs/msg/WrenchStamped
    producer: rt_control
    consumers: [motion]
    qos: Q_FAST_STATE
    external_type: true
    constraint: "右传感器坐标系、N/Nm、经设备标定与单位换算；不做工具/箱子重力补偿、不自动调零；配置未闭合时不可宣称有效"


  - id: R-OUT-07
    ros_name: /rt/arms/rolling/state
    kind: topic
    type: robot_rt_control_interfaces/msg/RollingJointControlState
    producer: rt_control
    consumers: [motion]
    qos: Q_ROLLING_STATE
    rate_hz: [50, 50]
    max_age_ms: 200
    axis_set: v3_dual_arm
    note: "三代双七轴 right_joint1..7,left_joint1..7；desired_positions rad、desired_velocities rad/s；axis_set_hash 与 open 一致"
    constraint: "协议、boot/session/client、mode/session、generation/sequence、execution/replaceable/buffered/age、三代双臂 desired q/qdot、独立 RejectCode/StopReason、switch evidence 与 limits source 全量可观测；reliable/volatile/keep-last(5)，deadline 100 ms、lifespan 200 ms；published_at 仅诊断，不参与命令排序或采样"


  - id: R-OUT-09
    ros_name: /rt/readiness
    kind: topic
    type: robot_system_interfaces/msg/DomainReadiness
    producer: rt_control
    consumers: [autonomy]
    qos: Q_LATCHED
    rate_hz: [1, 1]
    constraint: "ready 表示 RT-Control 当前能接收指令：未使能、控制器或硬件未激活、设备离线或故障锁存均为 false，blockers 给出稳定标记；变化立即发；稳定 1 Hz"


  - id: R-OUT-28
    ros_name: /rt/capabilities
    kind: topic
    type: std_msgs/msg/String
    producer: rt_control
    consumers: [external]
    qos: Q_LATCHED
    external_type: true
    constraint: "JSON 对象：schema_version=1、control_scope、use_mock_hardware、capabilities（本作用域提供的能力名列表）、hardware；作用域启动时发布一次"

  - id: R-OUT-10
    ros_name: /diagnostics
    kind: topic
    type: diagnostic_msgs/msg/DiagnosticArray
    producer: rt_control
    consumers: [external]
    qos: Q_DIAGNOSTIC
    external_type: true
    note: 不得替代 Action Result 或 readiness 证据
    constraint: "`Q_DIAGNOSTIC`；不替代 Action Result、readiness 或硬安全链"

