# 跨域 endpoint 注册表。
#
# 本文是 endpoint、类型、提供方、消费方、QoS 与关键约束的唯一注册表，
# 由 tools/contract_gate.py 做双向闭合校验：
#   - 本仓库每个 .msg/.srv/.action 必须被至少一个 endpoint 引用
#   - 每个 endpoint 的 type 必须真实存在于本仓库或声明为外部标准类型
#
# Wire schema 由本仓库对应 IDL 定义。不在本表中的跨域 endpoint 视为未授权。
# 域取值：rt_control / perception / motion / autonomy / external

version: "1.0.0"

domains: [rt_control, perception, motion, autonomy, external]

# 自定义 IDL 按 endpoint 提供方所属域唯一归档。shared 只承载四域共用
# 的基础载荷，不代表第五个业务域。消费域直接依赖提供方包，不复制 IDL。
package_owners:
  robot_system_interfaces: shared
  robot_rt_control_interfaces: rt_control
  robot_perception_interfaces: perception
  robot_motion_interfaces: motion
  robot_autonomy_interfaces: autonomy

qos_profiles: [Q_CONTROL, Q_ROLLING_COMMAND, Q_ROLLING_STATE, Q_FAST_STATE, Q_STATE, Q_LATCHED, Q_DIAGNOSTIC, Q_DEFAULT]

axis_sets:
  v3_dual_arm:
    count: 14
    joint_names: [right_joint1, right_joint2, right_joint3, right_joint4,
                  right_joint5, right_joint6, right_joint7,
                  left_joint1, left_joint2, left_joint3, left_joint4,
                  left_joint5, left_joint6, left_joint7]
    position_unit: rad
    velocity_unit: rad/s
  v3_swerve_wheels:
    count: 8
    joint_names: [steer1_joint, steer2_joint, steer3_joint, steer4_joint,
                  wheel1_joint, wheel2_joint, wheel3_joint, wheel4_joint]
    position_unit: rad
    velocity_unit: rad/s

endpoints:
  - id: G-01
    legacy_only: true
    note: "Legacy V2 Demo schema；不能直接用于 V3 任务；V3 Autonomy 仅按注册表调用泵/LED/保护复位，不直接控制阀/运动"
    ros_name: /autonomy/execute_demo_task
    kind: action
    type: robot_autonomy_interfaces/action/ExecuteDemoTask
    producer: autonomy
    consumers: [external]
    qos: Q_DEFAULT
    constraint: "同时只接受一个活动 Goal，第二个在 Goal 响应阶段 reject；终态三选一"


  - id: P-01
    legacy_only: true
    note: "Legacy V2 固定计划协议：25箱/15序列/0.74m；不代表 V3 箱墙观测和选箱职责"
    ros_name: /perception/build_wall_task_plan
    kind: action
    type: robot_perception_interfaces/action/BuildWallTaskPlan
    producer: perception
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "Goal 携带非零 `task_id` 与锁定 `scene_profile_id`；真实单次同步采集；Result 返回新 `scene_id`；25 箱；固定 15 序列；每箱冻结 arm 与 suction_mode，pose 为吸取表面接触位姿；每序列自带 `station_id`、统一 0.74 m 退避的 `station_nav_pose(map)`、按臂绑定重拍位；每个 G-01 只调用一次；严格成功"


  - id: P-02
    legacy_only: true
    note: "Legacy V2 序列精定位协议；不代表 V3 墙图更新和掉箱识别"
    ros_name: /perception/refine_sequence_poses
    kind: action
    type: robot_perception_interfaces/action/RefineSequencePoses
    producer: perception
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "Goal 的 `expected_scene_id`、sequence、box_ids、arms、suction_modes 必须与当前 producer instance 最近一次成功 P-01 完全一致；同箱同序；返回同臂同吸取方式的吸取表面接触位姿；`base_link`；stamp=真实曝光时刻；底盘静止、TF、标定不变"


  - id: P-03
    ros_name: /perception/obstacle_cloud
    kind: topic
    type: robot_perception_interfaces/msg/ObstacleCloud
    producer: perception
    consumers: [motion]
    qos: Q_STATE
    reserved: true
    constraint: "**产品预留**；Demo 不部署、不订阅、不依赖"


  - id: P-04
    ros_name: /perception/readiness
    kind: topic
    type: robot_system_interfaces/msg/DomainReadiness
    producer: perception
    consumers: [autonomy]
    qos: Q_LATCHED
    rate_hz: [1, 1]
    constraint: "`Q_LATCHED`；故障立即 `ready=false`；变化立即发；稳定 1 Hz"


  - id: P-NAV-01
    ros_name: /odom
    kind: topic
    type: nav_msgs/msg/Odometry
    producer: motion
    consumers: [perception, autonomy]
    qos: Q_FAST_STATE
    rate_hz: [50, 50]
    max_age_ms: 200
    external_type: true
    constraint: "Navigation/Motion 发布融合里程计；50 Hz；最大年龄 200 ms；Perception 可用于定位/视觉时空对齐；**最终停稳证据**"


  - id: P-NAV-02
    ros_name: /tf
    kind: topic
    type: tf2_msgs/msg/TFMessage
    producer: motion
    consumers: [perception, autonomy]
    qos: Q_DEFAULT
    external_type: true
    note: map → odom 由 Navigation/Motion 发布；Perception 通过 TF 查询 map→odom
    constraint: "map→odom 定位边唯一发布者为 Navigation/Motion；/tf 按坐标边判唯一性"
    multi_producer: true  # /tf 按坐标边判唯一性，见契约 6.11


  - id: N-01
    ros_name: /navigation/navigate_to_pose
    kind: action
    type: robot_motion_interfaces/action/NavigateToPoseTask
    producer: motion
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "`target_name + map_version` 由 Motion 通过语义地图解析为 Nav2 目标；真实调用 Nav2；最多总调用三次"


  - id: N-04
    ros_name: /rt/base/cmd_vel
    kind: topic
    type: geometry_msgs/msg/Twist
    producer: motion
    consumers: [rt_control]
    qos: Q_CONTROL
    rate_hz: [20, 50]
    watchdog_ms: 500
    external_type: true
    note: "当前 Navigation 职责由 motion 域承载；Twist 无 header，看门狗只使用 RT 本地接收间隔；后续 Motion 接管底盘另立协议"
    constraint: "底盘速度入口，仅在 R-IN-23 为 VELOCITY_READY（使能后默认）时生效，FJT_READY 时不被接受；20～50 Hz；500 ms 本地接收超时；不与旧 `/cmd_vel_safe` 或未来第二 writer 并行生效"


  - id: N-05
    ros_name: /navigation/localization/status
    kind: topic
    type: robot_motion_interfaces/msg/LocalizationStatus
    producer: motion
    consumers: [autonomy]
    qos: Q_STATE
    rate_hz: [10, 20]
    max_age_ms: 200
    constraint: "发布者唯一；10～20 Hz；最大年龄 200 ms"


  - id: N-10
    ros_name: /navigation/semanticmap/landmark_array
    kind: topic
    type: robot_motion_interfaces/msg/LandmarkArray
    producer: motion
    consumers: [perception, autonomy, external]
    qos: Q_STATE
    constraint: "当前语义地图地标列表；按 map_version 区分地图版本"


  - id: N-11
    ros_name: /navigation/semanticmap/add_landmark
    kind: service
    type: robot_motion_interfaces/srv/AddLandmark
    producer: motion
    consumers: [perception, external]
    qos: Q_DEFAULT
    constraint: "按指定位姿新增语义地标；返回 used_map_version 与最终地标"


  - id: N-12
    ros_name: /navigation/semanticmap/add_current_landmark
    kind: service
    type: robot_motion_interfaces/srv/AddCurrentLandmark
    producer: motion
    consumers: [perception, external]
    qos: Q_DEFAULT
    constraint: "以当前 base_footprint 位姿新增语义地标；返回 used_map_version 与最终地标"


  - id: N-13
    ros_name: /navigation/semanticmap/update_landmark
    kind: service
    type: robot_motion_interfaces/srv/UpdateLandmark
    producer: motion
    consumers: [perception, external]
    qos: Q_DEFAULT
    constraint: "更新语义地标属性和位姿；返回 used_map_version 与最终地标"


  - id: N-14
    ros_name: /navigation/semanticmap/remove_landmark
    kind: service
    type: robot_motion_interfaces/srv/RemoveLandmark
    producer: motion
    consumers: [perception, external]
    qos: Q_DEFAULT
    constraint: "按 name 删除指定 map_version 内的语义地标"


  - id: N-15
    ros_name: /navigation/semanticmap/get_landmark
    kind: service
    type: robot_motion_interfaces/srv/GetLandmark
    producer: motion
    consumers: [perception, autonomy, external]
    qos: Q_DEFAULT
    constraint: "按 target_name 查询语义地标；N-01 服务端用它解析导航目标"


  - id: N-16
    ros_name: /navigation/semanticmap/get_map
    kind: service
    type: robot_motion_interfaces/srv/GetSemanticMap
    producer: motion
    consumers: [perception, autonomy, external]
    qos: Q_DEFAULT
    constraint: "查询指定 map_version 下全部语义地标"


  - id: N-17
    legacy_only: true
    ros_name: /navigation/mapping/set_turn_state
    kind: service
    type: robot_motion_interfaces/srv/SetMappingTurnState
    producer: motion
    consumers: [autonomy, external]
    qos: Q_DEFAULT
    note: "Legacy V2 Turn 边界，保留既有协议；不是 V3 底盘接管或同步运动接口；turn_sequence 单调递增，同一 BEGIN_TURN/TURN_COMPLETE 重试幂等"
    constraint: "转台运动前 BEGIN_TURN 必须先暂停 FAST-LIO 到底盘的融合输入；停稳后同 caller_id、turn_sequence 的 TURN_COMPLETE 仅在实时 base_footprint←LiDAR TF 新鲜且连续稳定满配置窗口时切换固定外参，丢弃切换前排队里程计并恢复融合；乱序、并发事务或调用者不一致必须拒绝"


  - id: M-08
    legacy_only: true
    ros_name: /motion/execute_stage
    kind: action
    type: robot_motion_interfaces/action/ExecuteMotionStage
    producer: motion
    consumers: [autonomy]
    qos: Q_DEFAULT
    note: "Legacy V2 分阶段机械动作：12臂轴与Turn/Updown；保留供旧消费者迁移，不是 V3 双七轴或新抓放流程；不得通过旧流程调用已退役 VacuumGrip"
    constraint: "单一串行阶段 Action；无活动抓取流程时 TURN/CAMERA_VIEW/NAMED_JOINT_POSE 可任意独立触发；抓取流程固定 PREGRASP→APPROACH→PLACE→HOME，活动期间禁止独立任务、并发、跳步和提前触发"


  - id: M-09
    ros_name: /rt/arms/rolling/target_batch
    kind: topic
    type: robot_motion_interfaces/msg/RollingJointTargetBatch
    producer: motion
    consumers: [rt_control]
    qos: Q_ROLLING_COMMAND
    rate_hz: [30, 30]
    axis_set: v3_dual_arm
    note: "三代双七轴：right_joint1..7 后接 left_joint1..7；全部 rad/rad/s；从 replace_from 起替换缓冲轨迹，非运动臂仍须包含"
    constraint: "仅在 /rt/arms/set_control_mode 切到 ROLLING_READY 后生效；epoch 等于 R-OUT-07 当前 epoch；sequence 在同一 epoch 内严格递增；replace_from 为 ROS 时间（运控与 RT-Control 同机），不早于当前时刻 + 替换提前量；首点 time_from_start=0，位置与速度在拼接容差内等于缓冲轨迹在 replace_from 处的值；点时间严格递增，1～256 点，总长不超过缓冲上限；位置/速度/加速度不超过 robot_description 关节限位，且从任一点起都能在限值内停住；不满足整批拒绝，结果见 R-OUT-07 last_result；final=true 为本段最后一批，末点各轴速度须为 0（否则 FINAL_NOT_AT_REST）；最新接受的批次为 final 时不再需要后续批次、不计更新超时，执行到末点后保持并报 STOP_COMPLETED，期间仍可用新批次从其 replace_from 起替换，替换批次非 final 时恢复更新超时；最新接受的批次非 final 时，超过更新超时未收到有效批次，或缓冲耗尽时按限值刹停并保持；best-effort/volatile/keep-last(1)，deadline/lifespan 100 ms"


  - id: M-06
    ros_name: /motion/readiness
    kind: topic
    type: robot_system_interfaces/msg/DomainReadiness
    producer: motion
    consumers: [autonomy]
    qos: Q_LATCHED
    rate_hz: [1, 1]
    constraint: "机械能力准入；变化立即发；稳定 1 Hz"


  - id: N-06
    ros_name: /navigation/readiness
    kind: topic
    type: robot_system_interfaces/msg/DomainReadiness
    producer: motion
    consumers: [autonomy]
    qos: Q_LATCHED
    rate_hz: [1, 1]
    constraint: "导航执行能力准入；变化立即发；稳定 1 Hz"


  - id: R-IN-02
    ros_name: /rt/arms/follow_joint_trajectory
    kind: action
    type: control_msgs/action/FollowJointTrajectory
    producer: rt_control
    consumers: [motion]
    qos: Q_DEFAULT
    external_type: true
    axis_set: v3_dual_arm
    note: "三代双七轴 right_joint1..7,left_joint1..7；完整 14 轴；allow_partial_joints_goal=false"
    constraint: "完整三代双臂 7+7 轴；位置 rad、速度 rad/s；不包含 turn/updown 或 PP；`allow_partial_joints_goal=false`；整组取消。准入（RT-Control 实时侧）：每点必须带速度、末点速度为 0；首点时间为 0 时距实测位置 ≤ 1°，首点在未来时距实测位置 ≤ 速度上限×首点时间；各点速度与每段平均速度 ≤ 速度上限；每段三次插值加速度（含从上一条指令接入首点的一段）≤ 加速度上限；上限取自 robot_description（双臂 30°/s、60°/s²）；不满足整条拒绝"


  - id: R-IN-02L
    ros_name: /rt/arms/left/follow_joint_trajectory
    kind: action
    type: control_msgs/action/FollowJointTrajectory
    producer: rt_control
    consumers: [motion]
    qos: Q_DEFAULT
    external_type: true
    constraint: "仅单臂作用域提供；left_joint1..7；位置 rad、速度 rad/s；`allow_partial_joints_goal=false`；整组取消；双臂作用域只提供 R-IN-02"

  - id: R-IN-02R
    ros_name: /rt/arms/right/follow_joint_trajectory
    kind: action
    type: control_msgs/action/FollowJointTrajectory
    producer: rt_control
    consumers: [motion]
    qos: Q_DEFAULT
    external_type: true
    constraint: "仅单臂作用域提供；right_joint1..7；其余同 R-IN-02L"

  - id: R-IN-22
    ros_name: /rt/arms/joint_trajectory
    kind: topic
    type: trajectory_msgs/msg/JointTrajectory
    producer: rt_control
    consumers: [motion]
    qos: Q_CONTROL
    external_type: true
    axis_set: v3_dual_arm
    note: "流式下发（遥操作、视觉伺服、在线重规划）；与 R-IN-02 同一控制器，新消息替换尚未执行的轨迹；断流后保持最后目标"
    constraint: "完整三代双臂 7+7 轴；位置 rad、速度 rad/s；准入同 R-IN-02；用 header.stamp 标注首点时间基准；末点速度必须为 0；控制器从上一条指令接续新轨迹；与 R-IN-02 并发时以最后到达者为准（执行中的 action 目标被中止）"

  - id: R-IN-22L
    ros_name: /rt/arms/left/joint_trajectory
    kind: topic
    type: trajectory_msgs/msg/JointTrajectory
    producer: rt_control
    consumers: [motion]
    qos: Q_CONTROL
    external_type: true
    constraint: "仅单臂作用域提供；left_joint1..7；其余同 R-IN-22"

  - id: R-IN-22R
    ros_name: /rt/arms/right/joint_trajectory
    kind: topic
    type: trajectory_msgs/msg/JointTrajectory
    producer: rt_control
    consumers: [motion]
    qos: Q_CONTROL
    external_type: true
    constraint: "仅单臂作用域提供；right_joint1..7；其余同 R-IN-22"

  - id: R-IN-18
    ros_name: /rt/enable
    kind: service
    type: robot_rt_control_interfaces/srv/RtEnable
    producer: rt_control
    consumers: [external]
    qos: Q_DEFAULT
    constraint: "按使能策略分批使能全部受管驱动与握手设备并激活运动控制器；失败时返回失败批次、关节、状态字、阶段与 DREE 错误；不复位急停、安全继电器或 STO"

  - id: R-IN-19
    ros_name: /rt/disable
    kind: service
    type: robot_rt_control_interfaces/srv/RtEnable
    producer: rt_control
    consumers: [external]
    qos: Q_DEFAULT
    constraint: "停用运动控制器后有序失能全部受管设备；已失能时直接成功"

  - id: R-IN-20
    ros_name: /rt/reset_fault
    kind: service
    type: robot_rt_control_interfaces/srv/RtEnable
    producer: rt_control
    consumers: [external]
    qos: Q_DEFAULT
    constraint: "对作用域内全部故障设备做一次组复位；任一从站不在 OP 或反馈过期时拒绝（device_offline）；需要重启时拒绝（restart_required）；不使能"

  - id: R-IN-21
    ros_name: /rt/run_self_check
    kind: service
    type: std_srvs/srv/Trigger
    producer: rt_control
    consumers: [external]
    qos: Q_DEFAULT
    external_type: true
    constraint: "用最新一组设备状态重跑启动自检规则；success=false 表示有阻断项；message 给出阻断/警告数量；不写总线、不改变使能状态"

  - id: R-IN-04
    ros_name: /rt/vacuum/pump/set_enabled
    kind: service
    type: robot_rt_control_interfaces/srv/SetEnabled
    producer: rt_control
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "Autonomy 设置共用泵目标状态；普通停泵要求左右阀回读有效且为释放、左右压力有效且 >= -1 kPa、无活动阀操作；检查与执行期间阻止新吸附；enabled 为输出回读，输出未确认或未知时 accepted=false 并在 error 给出原因"


  - id: R-IN-05L
    ros_name: /rt/vacuum/left_valve/set_enabled
    kind: service
    type: robot_rt_control_interfaces/srv/SetEnabled
    producer: rt_control
    consumers: [motion]
    qos: Q_DEFAULT
    constraint: "enabled=true 吸附、false 释放；输出回读确认即返回 accepted=true，不等待建立真空；同侧忙拒绝；RT 不自动重试；输出未确认或未知时 accepted=false 并在 error 给出原因"

  - id: R-IN-05R
    ros_name: /rt/vacuum/right_valve/set_enabled
    kind: service
    type: robot_rt_control_interfaces/srv/SetEnabled
    producer: rt_control
    consumers: [motion]
    qos: Q_DEFAULT
    constraint: "同 R-IN-05L，作用于右阀"

  - id: R-IN-06
    ros_name: /rt/arms/set_control_mode
    kind: service
    type: robot_rt_control_interfaces/srv/SetJointControlMode
    producer: rt_control
    consumers: [motion]
    qos: Q_DEFAULT
    constraint: "仅在已使能且手臂静止时切换 FJT_READY/ROLLING_READY（VELOCITY_READY 只用于底盘 R-IN-23，手臂拒绝）；切换前 Motion 取消并等待 R-IN-02 Action 终态；新控制器以当前位置保持起步；失败时 accepted=false 并给出 ErrorInfo，mode 为调用后的实际模式；歧义切换进入 RESTART_REQUIRED（见 R-OUT-09）"


  - id: R-IN-23
    ros_name: /rt/base/set_control_mode
    kind: service
    type: robot_rt_control_interfaces/srv/SetJointControlMode
    producer: rt_control
    consumers: [motion]
    qos: Q_DEFAULT
    constraint: "仅在已使能且底盘静止时在 VELOCITY_READY（舵轮控制器接受 N-04，行走轮 CSV）与 FJT_READY（R-IN-24/R-IN-25 的轮子轨迹控制器接管 8 个轮关节位置，行走轮 CSP）之间切换；使能后默认 VELOCITY_READY；切换前 Motion 停发 N-04、取消并等待 R-IN-24 Action 终态；新控制器以当前位置保持起步，行走轮驱动器确认新模式后才返回成功；ROLLING_READY 拒绝；失败时 accepted=false 并给出 ErrorInfo，mode 为调用后的实际模式；歧义切换进入 RESTART_REQUIRED（见 R-OUT-09）"


  - id: R-IN-24
    ros_name: /rt/base/follow_joint_trajectory
    kind: action
    type: control_msgs/action/FollowJointTrajectory
    producer: rt_control
    consumers: [motion]
    qos: Q_DEFAULT
    external_type: true
    axis_set: v3_swerve_wheels
    note: "底盘 8 个轮关节 steer1..4_joint、wheel1..4_joint；行走轮为连续关节，位置为累计转角；allow_partial_joints_goal=false"
    constraint: "仅在 R-IN-23 为 FJT_READY 时接受；完整 8 轴；位置 rad、速度 rad/s；转向位置在机器人模型限位内；`allow_partial_joints_goal=false`；整组取消。准入（RT-Control 实时侧）：每点必须带速度、末点速度为 0；首点时间为 0 时距实测位置 ≤ 1°，首点在未来时距实测位置 ≤ 速度上限×首点时间；速度与加速度不超过底盘导航限值（转向 35°/s、35°/s²；行走轮轮面 2 m/s、2 m/s²，按轮半径换算为关节单位；由 RT-Control 底盘导航配置拥有，与 N-04 同一组）；不满足时整条拒绝（INVALID_GOAL），不执行半条"


  - id: R-IN-25
    ros_name: /rt/base/joint_trajectory
    kind: topic
    type: trajectory_msgs/msg/JointTrajectory
    producer: rt_control
    consumers: [motion]
    qos: Q_CONTROL
    external_type: true
    axis_set: v3_swerve_wheels
    note: "流式下发；与 R-IN-24 同一控制器，新消息替换尚未执行的轨迹；断流后保持最后目标"
    constraint: "仅在 R-IN-23 为 FJT_READY 时接受；完整 8 轴；位置 rad、速度 rad/s；准入同 R-IN-24；用 header.stamp 标注首点时间基准；末点速度必须为 0；控制器从上一条指令接续新轨迹；与 R-IN-24 并发时以最后到达者为准（执行中的 action 目标被中止）"


  - id: R-IN-12
    ros_name: /rt/led/set_rgbw
    kind: service
    type: robot_rt_control_interfaces/srv/SetLedRgbw
    producer: rt_control
    consumers: [autonomy]
    qos: Q_DEFAULT
    constraint: "六路灯带完整 RGBW 设置；全零灭灯；响应只证明通信写确认，不证明实际发光；退出和重启不主动改色或重放"


  - id: R-IN-16
    ros_name: /rt/head/move
    kind: action
    type: robot_rt_control_interfaces/action/MoveHead
    producer: rt_control
    consumers: [perception]
    qos: Q_DEFAULT
    constraint: "具名 head_joint/head_pitch_joint 弧度目标；同资源忙拒绝；取消停止并保持；旧 command topic 不允许外部并行写入"


  - id: R-OUT-01
    ros_name: /tf
    kind: topic
    type: tf2_msgs/msg/TFMessage
    producer: rt_control
    consumers: [perception, motion, autonomy]
    qos: Q_DEFAULT
    external_type: true
    note: robot_state_publisher 发布本体动态 TF
    constraint: "本体动态坐标边唯一；`map→odom` 与 `odom→base_footprint` 不由本域发布"
    multi_producer: true  # /tf 按坐标边判唯一性，见契约 6.11


  - id: R-OUT-01S
    ros_name: /tf_static
    kind: topic
    type: tf2_msgs/msg/TFMessage
    producer: rt_control
    consumers: [perception, motion, autonomy]
    qos: Q_LATCHED
    external_type: true
    note: robot_state_publisher 发布本体固定坐标边
    constraint: "本体固定坐标边唯一；`Q_LATCHED`；与 `/tf` 分开登记"


  - id: R-OUT-02
    ros_name: /rt/base/odom
    kind: topic
    type: nav_msgs/msg/Odometry
    producer: rt_control
    consumers: [perception]
    qos: Q_FAST_STATE
    rate_hz: [50, 50]
    max_age_ms: 200
    external_type: true
    note: frame_id=odom，child_frame_id=base_footprint；rt-control 不发 odom→base_footprint TF
    constraint: "`frame_id=odom`、`child_frame_id=base_footprint`；`Q_FAST_STATE`；50 Hz；**不作为到站或停稳最终证据**"


  - id: R-OUT-03
    ros_name: /joint_states
    kind: topic
    type: sensor_msgs/msg/JointState
    producer: rt_control
    consumers: [motion, perception, autonomy]
    qos: Q_FAST_STATE
    external_type: true
    note: "整机各受管模块按真实采样时间发布不重叠关节子集；一关节一个权威来源；有效性与时效由模块状态配套表达"
    constraint: "双臂、PP、升降、头部及底盘相关关节使用统一入口；不填伪造零值、不刷新旧样本时间、不把多模块拼成虚假同步快照"


  - id: R-OUT-04L
    ros_name: /rt/battery/left/state
    kind: topic
    type: sensor_msgs/msg/BatteryState
    producer: rt_control
    consumers: [autonomy]
    qos: Q_STATE
    rate_hz: [0.2, 0.2]
    note: BMS 周期 5 s；只读，不作为业务控制入口
    external_type: true
    constraint: "左电池（BMS 地址 1）；BMS 周期 5 s（0.2 Hz）；只读，不作为业务控制入口"


  - id: R-OUT-04R
    ros_name: /rt/battery/right/state
    kind: topic
    type: sensor_msgs/msg/BatteryState
    producer: rt_control
    consumers: [autonomy]
    qos: Q_STATE
    rate_hz: [0.2, 0.2]
    note: BMS 周期 5 s；只读，不作为业务控制入口
    external_type: true
    constraint: "右电池（BMS 地址 2）；BMS 周期 5 s（0.2 Hz）；只读，不作为业务控制入口"


  - id: R-OUT-05L
    ros_name: /rt/vacuum/left/pressure
    kind: topic
    type: sensor_msgs/msg/FluidPressure
    producer: rt_control
    consumers: [motion, autonomy]
    qos: Q_STATE
    rate_hz: [20, 50]
    external_type: true
    constraint: "左侧真空表压，单位 Pa，负值为真空（偏离 FluidPressure 标准的绝压定义）；p<=-60000 Pa 为建立、p>=-1000 Pa 为释放，由消费方按此阈值判定；stamp 为样本时间；通信失败停发，由 R-OUT-20 报错"

  - id: R-OUT-05R
    ros_name: /rt/vacuum/right/pressure
    kind: topic
    type: sensor_msgs/msg/FluidPressure
    producer: rt_control
    consumers: [motion, autonomy]
    qos: Q_STATE
    rate_hz: [20, 50]
    external_type: true
    constraint: "右侧真空表压，单位 Pa，负值为真空（偏离 FluidPressure 标准的绝压定义）；p<=-60000 Pa 为建立、p>=-1000 Pa 为释放，由消费方按此阈值判定；stamp 为样本时间；通信失败停发，由 R-OUT-20 报错"

  - id: R-OUT-19A
    ros_name: /rt/ultrasonic/channel1/range
    kind: topic
    type: sensor_msgs/msg/Range
    producer: rt_control
    consumers: [autonomy]
    qos: Q_FAST_STATE
    max_age_ms: 2500
    external_type: true
    constraint: "米制距离；通信失败停发并由状态接口立即报错；年龄超过 2.5 s 过期；无目标 +Inf，协议异常 NaN"


  - id: R-OUT-19B
    ros_name: /rt/ultrasonic/channel2/range
    kind: topic
    type: sensor_msgs/msg/Range
    producer: rt_control
    consumers: [autonomy]
    qos: Q_FAST_STATE
    max_age_ms: 2500
    external_type: true
    constraint: "同 R-OUT-19A；通道与安装外参须由版本化配置确认"


  - id: R-OUT-19C
    ros_name: /rt/ultrasonic/channel3/range
    kind: topic
    type: sensor_msgs/msg/Range
    producer: rt_control
    consumers: [autonomy]
    qos: Q_FAST_STATE
    max_age_ms: 2500
    external_type: true
    constraint: "同 R-OUT-19A；通道与安装外参须由版本化配置确认"


  - id: R-OUT-19D
    ros_name: /rt/ultrasonic/channel4/range
    kind: topic
    type: sensor_msgs/msg/Range
    producer: rt_control
    consumers: [autonomy]
    qos: Q_FAST_STATE
    max_age_ms: 2500
    external_type: true
    constraint: "同 R-OUT-19A；通道与安装外参须由版本化配置确认"


  - id: R-OUT-19E
    ros_name: /rt/ultrasonic/channel5/range
    kind: topic
    type: sensor_msgs/msg/Range
    producer: rt_control
    consumers: [autonomy]
    qos: Q_FAST_STATE
    max_age_ms: 2500
    external_type: true
    constraint: "米制距离；第二 E08 独立发布，第一模块失败不得阻止本侧；其余同 R-OUT-19A"


  - id: R-OUT-19F
    ros_name: /rt/ultrasonic/channel6/range
    kind: topic
    type: sensor_msgs/msg/Range
    producer: rt_control
    consumers: [autonomy]
    qos: Q_FAST_STATE
    max_age_ms: 2500
    external_type: true
    constraint: "同 R-OUT-19E；通道与安装外参须由版本化配置确认"


  - id: R-OUT-19G
    ros_name: /rt/ultrasonic/channel7/range
    kind: topic
    type: sensor_msgs/msg/Range
    producer: rt_control
    consumers: [autonomy]
    qos: Q_FAST_STATE
    max_age_ms: 2500
    external_type: true
    constraint: "同 R-OUT-19E；通道与安装外参须由版本化配置确认"


  - id: R-OUT-19H
    ros_name: /rt/ultrasonic/channel8/range
    kind: topic
    type: sensor_msgs/msg/Range
    producer: rt_control
    consumers: [autonomy]
    qos: Q_FAST_STATE
    max_age_ms: 2500
    external_type: true
    constraint: "同 R-OUT-19E；通道与安装外参须由版本化配置确认"


  - id: R-OUT-20
    ros_name: /rt/sensors/state
    kind: topic
    type: robot_rt_control_interfaces/msg/SensorStatusArray
    producer: rt_control
    consumers: [motion, autonomy]
    qos: Q_STATE
    constraint: "逐传感器声明有效、无目标、协议异常、通信错误、过期或未配置；每项保留真实样本时间，数组发布时间不刷新旧观测"


  - id: R-OUT-21
    ros_name: /rt/infrared/state
    kind: topic
    type: robot_rt_control_interfaces/msg/DigitalInputStateArray
    producer: rt_control
    consumers: [autonomy]
    qos: Q_STATE
    constraint: "手臂红外只表示目标检测开关量；逐通道标识、原始电平、语义状态和有效性；未知不得当成未检测，不直接触发运动停止"


  - id: R-OUT-22
    ros_name: /rt/imu/data
    kind: topic
    type: sensor_msgs/msg/Imu
    producer: rt_control
    consumers: [motion]
    qos: Q_FAST_STATE
    external_type: true
    constraint: "当前 Navigation 职责由 motion 域消费；SI 单位；时间为主机发布/接收链语义，不声明设备同步；无效拼接不重发旧测量；独立磁场不公开"


  - id: R-OUT-23L
    ros_name: /rt/force_torque/left_wrist/wrench
    kind: topic
    type: geometry_msgs/msg/WrenchStamped
    producer: rt_control
    consumers: [motion]
    qos: Q_FAST_STATE
    external_type: true
    constraint: "左传感器坐标系、N/Nm、经设备标定与单位换算；不做工具/箱子重力补偿、不自动调零；配置未闭合时不可宣称有效"


  - id: R-OUT-23R
    ros_name: /rt/force_torque/right_wrist/wrench
    kind: topic
    type: geometry_msgs/msg/WrenchStamped
    producer: rt_control
    consumers: [motion]
    qos: Q_FAST_STATE
    external_type: true
    constraint: "右传感器坐标系、N/Nm、经设备标定与单位换算；不做工具/箱子重力补偿、不自动调零；配置未闭合时不可宣称有效"


  - id: R-OUT-07
    ros_name: /rt/arms/rolling/state
    kind: topic
    type: robot_rt_control_interfaces/msg/RollingJointControlState
    producer: rt_control
    consumers: [motion]
    qos: Q_ROLLING_STATE
    rate_hz: [50, 50]
    max_age_ms: 200
    axis_set: v3_dual_arm
    note: "rolling 控制器激活期间发布；5 个字段：epoch、state、last_sequence、last_result、stop_reason"
    constraint: "每次激活 epoch 加 1；state 为 HOLDING（无轨迹）/STARTING（开始一段轨迹的批次已接受，等待其 replace_from）/RUNNING/STOPPING；last_sequence/last_result 只报本 epoch 最新收到的批次；stop_reason 为当前或最近一段轨迹的停止原因，自开始该段的批次被接受起为 STOP_NONE，停止后保持到下一段开始；final 轨迹执行到末点报 STOP_COMPLETED，由 RUNNING 直接进入 HOLDING；reliable/volatile/keep-last(5)，deadline 100 ms、lifespan 200 ms"


  - id: R-OUT-09
    ros_name: /rt/readiness
    kind: topic
    type: robot_system_interfaces/msg/DomainReadiness
    producer: rt_control
    consumers: [autonomy]
    qos: Q_LATCHED
    rate_hz: [1, 1]
    constraint: "ready 表示 RT-Control 当前能接收指令：未使能、控制器或硬件未激活、设备离线或故障锁存均为 false，blockers 给出稳定标记；变化立即发；稳定 1 Hz"


  - id: R-OUT-28
    ros_name: /rt/capabilities
    kind: topic
    type: std_msgs/msg/String
    producer: rt_control
    consumers: [external]
    qos: Q_LATCHED
    external_type: true
    constraint: "JSON 对象：schema_version=1、control_scope、use_mock_hardware、capabilities（本作用域提供的能力名列表）、hardware；作用域启动时发布一次"

  - id: R-OUT-10
    ros_name: /diagnostics
    kind: topic
    type: diagnostic_msgs/msg/DiagnosticArray
    producer: rt_control
    consumers: [external]
    qos: Q_DIAGNOSTIC
    external_type: true
    note: 不得替代 Action Result 或 readiness 证据
    constraint: "`Q_DIAGNOSTIC`；不替代 Action Result、readiness 或硬安全链"

# 成员类型：被上述 endpoint 的载荷间接引用，不单独出现在 ROS graph。
member_types:
  - robot_system_interfaces/msg/ErrorCode
  - robot_system_interfaces/msg/ErrorInfo
  - robot_motion_interfaces/msg/Landmark
  - robot_motion_interfaces/msg/DualArmPoseTargets
  - robot_motion_interfaces/msg/RollingJointPoint
  - robot_rt_control_interfaces/msg/JointControlMode
  - robot_rt_control_interfaces/msg/ObservationMeta
  - robot_rt_control_interfaces/msg/MotionExecutionState
  - robot_rt_control_interfaces/msg/DigitalInputState
  - robot_rt_control_interfaces/msg/SensorStatus
  - robot_perception_interfaces/msg/BoxPose
  - robot_perception_interfaces/msg/CameraViewPose
  - robot_perception_interfaces/msg/PickSequence
  - robot_perception_interfaces/msg/WallTaskPlan

# 禁止的通信边。各域 CI 与联调 ros2 node info 复核。
forbidden_edges:
  - {from: autonomy, to: /rt/base/cmd_vel}
  - {from: autonomy, to: /rt/arms/follow_joint_trajectory}
  - {from: autonomy, to: /rt/enable}
  - {from: autonomy, to: /rt/disable}
  - {from: autonomy, to: /rt/reset_fault}
  - {from: autonomy, to: /rt/vacuum/left_valve/set_enabled}
  - {from: autonomy, to: /rt/vacuum/right_valve/set_enabled}
  - {from: motion, to: /rt/vacuum/pump/set_enabled}
  - {from: motion, to: /rt/led/set_rgbw}
  - {from: perception, to: /navigation/navigate_to_pose}

# 已删除的 endpoint。出现在 ROS graph 中即为违约。
